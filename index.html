<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมเรียงคำให้ถูก</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: linear-gradient(135deg, #fff8e7, #f5efe2);
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 10px;
      color: #5b4636;
    }

    .subtitle {
      font-size: 17px;
      color: #777;
      line-height: 1.6;
    }

    .instruction {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      border: 2px solid #eadfce;
    }

    .instruction strong {
      color: #b06b35;
    }

    .progress {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 18px 0;
      color: #5b4636;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      position: relative;
      background: white;
      border: 3px solid #e4d7c5;
      border-radius: 18px;
      padding: 25px 18px;
      min-height: 130px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
      text-align: center;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #c99b68;
    }

    .card.selected {
      border-color: #8b6b4a;
      background: #f8f0e4;
    }

    .rank {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #8b6b4a;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: bold;
    }

    .card.selected .rank {
      display: flex;
    }

    .wrong-word {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #4d3b2e;
    }

    .arrow {
      font-size: 20px;
      color: #999;
    }

    .correct-word {
      display: none;
    }

    .reason {
      display: none;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.1);
      font-size: 15px;
      line-height: 1.6;
      text-align: left;
    }

    /* หลังเฉลย */
    .card.correct {
      border-color: #55a36a;
      background: #edf8ef;
    }

    .card.correct .rank {
      background: #55a36a;
    }

    .card.correct .correct-word {
      display: inline;
      font-weight: bold;
      color: #27743b;
    }

    .card.correct .reason {
      display: block;
      color: #45604b;
    }

    .card.incorrect {
      border-color: #d16b6b;
      background: #fff0f0;
    }

    .card.incorrect .rank {
      background: #d16b6b;
    }

    .card.incorrect .correct-word {
      display: inline;
      font-weight: bold;
      color: #b53d3d;
    }

    .card.incorrect .reason {
      display: block;
      color: #704545;
    }

    .buttons {
      text-align: center;
      margin-top: 30px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    #answerBtn {
      background: #5b4636;
      color: white;
      display: none;
    }

    #answerBtn:hover {
      background: #453429;
    }

    #resetBtn {
      background: #d8c2a8;
      color: #4d3b2e;
    }

    #resetBtn:hover {
      background: #cdb393;
    }

    .score {
      display: none;
      text-align: center;
      margin: 25px 0;
      font-size: 25px;
      font-weight: bold;
      color: #5b4636;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 115px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>🔎 ล่าคำที่ถูกต้อง</h1>
    <div class="subtitle">
      เกมเรียงลำดับคำที่มักเขียนผิด
    </div>
  </header>

  <div class="instruction">
    <strong>วิธีเล่น</strong><br>
    คลิกเลือกคำตามลำดับที่คิดว่า “พบการเขียนผิดบ่อยที่สุด”<br>
    เลือกให้ครบ <strong>1–10</strong> ก่อน แล้วจึงกด <strong>เฉลย</strong>
  </div>

  <div class="progress" id="progress">
    เลือกแล้ว 0 / 10
  </div>

  <div class="cards" id="cards"></div>

  <div class="score" id="score"></div>

  <div class="message" id="message"></div>

  <div class="buttons">
    <button id="answerBtn" onclick="showAnswer()">
      🔍 เฉลย
    </button>

    <button id="resetBtn" onclick="resetGame()">
      🔄 เล่นอีกครั้ง
    </button>
  </div>

</div>

<script>

const words = [
  {
    wrong: "สเต็ก",
    correct: "สเต๊ก",
    reason: "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา ทำให้ผู้คนคุ้นเคยกับคำนี้และมีโอกาสพบรูปสะกดที่หลากหลายสูง"
  },
  {
    wrong: "เฟสบุ๊ค",
    correct: "เฟซบุ๊ก",
    reason: "เป็นคำที่ใช้ในชีวิตประจำวันและสื่อออนไลน์อย่างแพร่หลาย จึงมีโอกาสพบการสะกดคลาดเคลื่อนจำนวนมาก"
  },
  {
    wrong: "คอมเม้นต์",
    correct: "คอมเมนต์",
    reason: "ใช้บ่อยในโซเชียลมีเดีย โดยเฉพาะช่องแสดงความคิดเห็น ทำให้พบรูปสะกดที่คลาดเคลื่อนได้เป็นจำนวนมาก"
  },
  {
    wrong: "ลิงค์",
    correct: "ลิงก์",
    reason: "ใช้เป็นประจำในเว็บไซต์ เอกสาร และการสื่อสารออนไลน์ แต่มีบริบทการใช้งานแคบกว่าคำในอันดับต้น ๆ"
  },
  {
    wrong: "บูธ",
    correct: "บูท",
    reason: "มักใช้ในงานแสดงสินค้า นิทรรศการ และกิจกรรมต่าง ๆ จึงพบมากในบางบริบท แต่ไม่ครอบคลุมการใช้ภาษาในชีวิตประจำวันทั้งหมด"
  },
  {
    wrong: "เวิร์กช็อป",
    correct: "เวิร์กชอป",
    reason: "พบในงานอบรม สัมมนา และกิจกรรมการเรียนรู้เป็นหลัก จึงมีการใช้งานเฉพาะบริบทมากกว่าคำอันดับก่อนหน้า"
  },
  {
    wrong: "แมพ",
    correct: "แมป",
    reason: "พบมากในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์บางกลุ่ม จึงมีการใช้จำกัดอยู่ในกลุ่มผู้ใช้เฉพาะทางมากกว่า"
  },
  {
    wrong: "ถาปัตย์",
    correct: "สถาปัตย์",
    reason: "เป็นคำที่เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษาเป็นหลัก จึงพบในภาษาทั่วไปน้อยกว่าคำที่อยู่ในอันดับต้น ๆ"
  },
  {
    wrong: "อยู่ดี กรีนดี",
    correct: "อยู่ดีกินดี",
    reason: "เป็นการเล่นคำที่เกิดขึ้นเฉพาะในบางแคมเปญหรือกิจกรรม จึงไม่ได้มีการใช้แพร่หลายในชีวิตประจำวันเหมือนคำอื่น"
  },
  {
    wrong: "นมโสด",
    correct: "นมสด",
    reason: "เป็นคำที่ถูกนำไปดัดแปลงเป็นคำเล่นในบางร้านหรือแคมเปญการตลาด จึงพบเฉพาะกรณีและไม่ใช่การสะกดผิดที่เกิดขึ้นทั่วไป"
  }
];

let shuffledWords = [];
let selectedOrder = [];
let answered = false;

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function startGame() {

  shuffledWords = shuffle(words);
  selectedOrder = [];
  answered = false;

  const cardsContainer = document.getElementById("cards");

  cardsContainer.innerHTML = "";

  document.getElementById("answerBtn").style.display = "none";
  document.getElementById("score").style.display = "none";
  document.getElementById("message").style.display = "none";

  updateProgress();

  shuffledWords.forEach((word, index) => {

    const card = document.createElement("div");

    card.className = "card";

    card.dataset.index = index;

    card.innerHTML = `
      <div class="rank"></div>

      <div class="wrong-word">
        ${word.wrong}
      </div>

      <div class="arrow">
        ↓
      </div>

      <div class="correct-word">
        ${word.correct}
      </div>

      <div class="reason">
        ${word.reason}
      </div>
    `;

    card.addEventListener("click", () => selectCard(card, index));

    cardsContainer.appendChild(card);
  });
}

function selectCard(card, index) {

  // ถ้าเฉลยแล้ว ห้ามเลือกเพิ่ม
  if (answered) return;

  // ถ้าเลือกใบนี้ไปแล้ว ไม่ต้องทำอะไร
  if (selectedOrder.includes(index)) return;

  // เพิ่มลำดับ
  selectedOrder.push(index);

  const rankNumber = selectedOrder.length;

  card.classList.add("selected");

  card.querySelector(".rank").textContent = rankNumber;

  updateProgress();

  // เมื่อเลือกครบ 10 คำ
  if (selectedOrder.length === words.length) {

    document.getElementById("answerBtn").style.display = "inline-block";

    document.getElementById("progress").textContent =
      "เลือกครบ 10 คำแล้ว — พร้อมเฉลย 🎉";
  }
}

function updateProgress() {

  if (selectedOrder.length < words.length) {

    document.getElementById("progress").textContent =
      `เลือกแล้ว ${selectedOrder.length} / ${words.length}`;
  }
}

function showAnswer() {

  if (selectedOrder.length !== words.length) return;

  answered = true;

  let score = 0;

  const cards = document.querySelectorAll(".card");

  selectedOrder.forEach((wordIndex, position) => {

    const card = cards[wordIndex];

    const correctPosition = words.indexOf(shuffledWords[wordIndex]) + 1;

    if (position + 1 === correctPosition) {

      card.classList.remove("selected");
      card.classList.add("correct");

      score++;

    } else {

      card.classList.remove("selected");
      card.classList.add("incorrect");
    }
  });

  document.getElementById("score").style.display = "block";

  document.getElementById("score").textContent =
    `🏆 คะแนนของคุณ: ${score} / 10`;

  const message = document.getElementById("message");

  message.style.display = "block";

  if (score === 10) {

    message.textContent =
      "🎉 ยอดเยี่ยม! เรียงถูกทั้งหมด";

  } else if (score >= 7) {

    message.textContent =
      "👏 เก่งมาก! ลองดูเหตุผลของแต่ละคำเพิ่มเติม";

  } else {

    message.textContent =
      "💡 ลองอ่านเหตุผลของแต่ละคำ แล้วเล่นอีกครั้ง";
  }

  document.getElementById("answerBtn").style.display = "none";
}

function resetGame() {
  startGame();
}

startGame();

</script>

</body>
</html>
