<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>จัดอันดับคำไทยให้ถูกต้อง</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        "Noto Sans Thai",
        "Tahoma",
        "Leelawadee UI",
        sans-serif;
      background: #080b18;
      color: #ffffff;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .app {
      position: relative;
      min-height: 100dvh;
      padding: clamp(14px, 2vw, 30px);
      overflow: hidden;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(124, 58, 237, 0.28),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(59, 130, 246, 0.22),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #080b18,
          #10152d 50%,
          #090d1d
        );
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      opacity: 0.25;
    }

    .glow.one {
      width: 300px;
      height: 300px;
      background: #7c3aed;
      top: -150px;
      left: -100px;
    }

    .glow.two {
      width: 300px;
      height: 300px;
      background: #2563eb;
      right: -120px;
      bottom: -100px;
    }

    /* =========================
       MAIN
    ========================= */

    .container {
      position: relative;
      z-index: 1;

      width: min(1500px, 100%);
      min-height: calc(100dvh - 2 * clamp(14px, 2vw, 30px));
      margin: auto;

      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.2vw, 18px);
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: clamp(15px, 1.6vw, 24px);

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;

      background: rgba(18, 23, 48, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .title-area {
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;

      padding: 5px 12px;
      margin-bottom: 5px;

      border-radius: 999px;

      font-size: clamp(10px, 0.8vw, 13px);
      font-weight: 800;
      letter-spacing: 0.08em;

      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(167, 139, 250, 0.3);
      color: #c4b5fd;
    }

    h1 {
      margin: 0;

      font-size: clamp(24px, 3vw, 44px);
      line-height: 1.1;
      font-weight: 800;

      background: linear-gradient(
        90deg,
        #ffffff,
        #c4b5fd
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 6px 0 0;

      color: #aab2d5;
      font-size: clamp(12px, 1.1vw, 17px);
    }

    /* =========================
       SCORE
    ========================= */

    .score-box {
      flex-shrink: 0;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 10px 16px;

      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .score-number {
      font-size: clamp(24px, 2.5vw, 38px);
      font-weight: 800;
      line-height: 1;
      color: #a78bfa;
    }

    .score-text {
      color: #b9c0dd;
      font-size: clamp(11px, 0.9vw, 14px);
      line-height: 1.35;
    }

    /* =========================
       INFO BAR
    ========================= */

    .info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      padding: 10px 16px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .instruction {
      color: #cbd2ed;
      font-size: clamp(12px, 1vw, 16px);
    }

    .progress-area {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 180px;
    }

    .progress-text {
      white-space: nowrap;
      color: #aeb7d8;
      font-size: 13px;
    }

    .progress {
      width: 120px;
      height: 7px;

      overflow: hidden;

      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background: linear-gradient(
        90deg,
        #8b5cf6,
        #3b82f6
      );

      transition: width 0.3s ease;
    }

    /* =========================
       CARDS
    ========================= */

    .cards {
      flex: 1;

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      grid-template-rows:
        repeat(2, minmax(0, 1fr));

      gap: clamp(10px, 1.1vw, 17px);

      min-height: 0;
    }

    .card {
      position: relative;

      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: clamp(12px, 1.5vw, 22px);

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(35, 42, 78, 0.95),
          rgba(20, 25, 52, 0.95)
        );

      border: 1px solid rgba(255, 255, 255, 0.1);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.2);

      cursor: pointer;

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .card:hover:not(.locked) {
      transform: translateY(-4px);

      border-color: rgba(167, 139, 250, 0.55);

      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.3),
        0 0 25px rgba(139, 92, 246, 0.12);
    }

    .card.selected {
      transform: translateY(-4px);

      border-color: #a78bfa;

      background:
        linear-gradient(
          145deg,
          rgba(91, 61, 160, 0.95),
          rgba(40, 38, 91, 0.95)
        );

      box-shadow:
        0 0 0 2px rgba(167, 139, 250, 0.18),
        0 15px 35px rgba(91, 61, 160, 0.3);
    }

    .card.locked {
      cursor: default;

      background:
        linear-gradient(
          145deg,
          rgba(19, 104, 72, 0.9),
          rgba(12, 64, 52, 0.95)
        );

      border-color: rgba(52, 211, 153, 0.6);

      box-shadow:
        0 0 25px rgba(16, 185, 129, 0.15);
    }

    .card.wrong {
      animation: wrongShake 0.35s ease;
      border-color: #fb7185;
      background:
        linear-gradient(
          145deg,
          rgba(127, 29, 29, 0.85),
          rgba(69, 18, 35, 0.95)
        );
    }

    @keyframes wrongShake {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-7px);
      }

      75% {
        transform: translateX(7px);
      }
    }

    /* =========================
       CARD CONTENT
    ========================= */

    .card-content {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 8px;

      text-align: center;
    }

    /*
      สำคัญ:
      คำศัพท์ทุกใบใช้ขนาดเดียวกัน
      ไม่ย่อแยกตามความยาวคำ
    */

    .word {
      width: 100%;

      color: #ffffff;

      font-size: clamp(22px, 2.15vw, 34px);
      font-weight: 800;

      line-height: 1.25;
      letter-spacing: 0;

      text-align: center;

      white-space: nowrap;

      /*
        ไม่ใช้ ellipsis
        เพื่อไม่ให้คำกลายเป็น ...
      */
      overflow: hidden;
      text-overflow: clip;
    }

    /*
      เหตุผลจะปรากฏเฉพาะเมื่อถูกต้อง
      และทำให้ใหญ่กว่าเดิม
    */

    .reason {
      width: 100%;

      color: #dce4f5;

      font-size: clamp(15px, 1.15vw, 20px);
      font-weight: 500;

      line-height: 1.45;

      text-align: center;

      display: none;
    }

    .card.locked .reason {
      display: block;
    }

    /* วงกลมแสดงเลขอันดับเฉพาะตอนตอบถูก */

    .rank-circle {
      position: absolute;

      top: 10px;
      left: 10px;

      width: clamp(30px, 2.5vw, 42px);
      height: clamp(30px, 2.5vw, 42px);

      display: none;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #10b981;
      color: #ffffff;

      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: 800;

      box-shadow:
        0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .card.locked .rank-circle {
      display: flex;
    }

    /* =========================
       BUTTONS
    ========================= */

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      outline: none;

      padding:
        clamp(9px, 0.9vw, 13px)
        clamp(15px, 1.5vw, 23px);

      border-radius: 14px;

      color: white;

      font-size: clamp(12px, 1vw, 16px);
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.clear {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn.check {
      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #6366f1
        );

      box-shadow:
        0 8px 22px rgba(99, 102, 241, 0.25);
    }

    .btn.check:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn.restart {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );
    }

    /* =========================
       COMPLETION MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(3, 5, 15, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(500px, 100%);

      padding: 35px;

      text-align: center;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          #20284c,
          #12172e
        );

      border: 1px solid rgba(255, 255, 255, 0.13);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.5);
    }

    .trophy {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .modal-box h2 {
      margin: 0 0 10px;

      font-size: clamp(24px, 3vw, 36px);
    }

    .modal-box p {
      margin: 5px 0;

      color: #bac3e2;
      font-size: 17px;
    }

    .final-score {
      margin: 20px 0;

      font-size: 42px;
      font-weight: 800;

      color: #a78bfa;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1100px) and (orientation: landscape) {
      .cards {
        gap: 9px;
      }

      .card {
        border-radius: 17px;
        padding: 10px;
      }

      .word {
        font-size: 25px;
      }

      .reason {
        font-size: 15px;
      }
    }

    /* =========================
       PORTRAIT / MOBILE
    ========================= */

    @media (orientation: portrait) {
      body {
        overflow-y: auto;
      }

      .app {
        min-height: 100dvh;
        overflow: visible;
      }

      .container {
        min-height: auto;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .score-box {
        justify-content: center;
      }

      .info-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .progress-area {
        width: 100%;
      }

      .progress {
        flex: 1;
        width: auto;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: none;

        flex: none;

        min-height: auto;
      }

      .card {
        min-height: 150px;
      }

      .word {
        font-size: 25px;
      }

      .reason {
        font-size: 17px;
      }
    }

    @media (max-width: 500px) {
      .app {
        padding: 10px;
      }

      .container {
        gap: 10px;
      }

      .header {
        padding: 15px;
        border-radius: 18px;
      }

      h1 {
        font-size: 25px;
      }

      .subtitle {
        font-size: 12px;
      }

      .cards {
        gap: 8px;
      }

      .card {
        min-height: 140px;
        border-radius: 16px;
      }

      .word {
        font-size: 23px;
      }

      .reason {
        font-size: 16px;
      }
    }

    @media (max-width: 330px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="container">

      <!-- HEADER -->

      <header class="header">

        <div class="title-area">

          <div class="badge">
            THAI WORD CHALLENGE
          </div>

          <h1>
            จัดอันดับคำไทยให้ถูกต้อง
          </h1>

          <p class="subtitle">
            เลือกคำที่คิดว่าสะกดถูก แล้วจัดอันดับให้ครบทั้ง 10 คำ
          </p>

        </div>

        <div class="score-box">

          <div class="score-number" id="score">
            0
          </div>

          <div class="score-text">
            คะแนนของคุณ
            <br>
            ตอบถูกแล้ว
          </div>

        </div>

      </header>


      <!-- INFO -->

      <section class="info-bar">

        <div class="instruction">
          💡 วิธีเล่น: แตะคำเพื่อเลือกอันดับ • แตะซ้ำเพื่อยกเลิก
        </div>

        <div class="progress-area">

          <div class="progress-text" id="progressText">
            0 / 10
          </div>

          <div class="progress">
            <div
              class="progress-fill"
              id="progressFill">
            </div>
          </div>

        </div>

      </section>


      <!-- CARDS -->

      <section
        class="cards"
        id="cards">
      </section>


      <!-- CONTROLS -->

      <div class="controls">

        <button
          class="btn clear"
          id="clearBtn">
          ↺ ล้างคำตอบ
        </button>

        <button
          class="btn check"
          id="checkBtn"
          disabled>
          ✓ ตรวจคำตอบ
        </button>

        <button
          class="btn restart"
          id="restartBtn">
          ⟳ เริ่มเกมใหม่
        </button>

      </div>

    </main>

  </div>


  <!-- COMPLETION -->

  <div
    class="modal"
    id="modal">

    <div class="modal-box">

      <div class="trophy">
        🏆
      </div>

      <h2>
        ยินดีด้วย!
      </h2>

      <p>
        คุณจัดอันดับคำได้ครบทั้ง 10 คำแล้ว
      </p>

      <div
        class="final-score"
        id="finalScore">
        10 / 10
      </div>

      <button
        class="btn restart"
        id="playAgainBtn">
        ⟳ เล่นอีกครั้ง
      </button>

    </div>

  </div>


  <script>

    /* ==========================================
       ข้อมูลคำศัพท์
    ========================================== */

    const WORDS = [

      {
        rank: 1,
        wrong: "สเต็ก",
        correct: "สเต๊ก",
        reason:
          "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา"
      },

      {
        rank: 2,
        wrong: "เฟสบุ๊ค",
        correct: "เฟซบุ๊ก",
        reason:
          "ใช้แพร่หลายในชีวิตประจำวันและสื่อออนไลน์"
      },

      {
        rank: 3,
        wrong: "คอมเม้นต์",
        correct: "คอมเมนต์",
        reason:
          "ใช้บ่อยในโซเชียลมีเดียและช่องแสดงความคิดเห็น"
      },

      {
        rank: 4,
        wrong: "ลิงค์",
        correct: "ลิงก์",
        reason:
          "พบเป็นประจำในเว็บไซต์ เอกสาร และการสื่อสารออนไลน์"
      },

      {
        rank: 5,
        wrong: "บูธ",
        correct: "บูท",
        reason:
          "มักพบในงานแสดงสินค้า นิทรรศการ และกิจกรรมต่าง ๆ"
      },

      {
        rank: 6,
        wrong: "เวิร์กช็อป",
        correct: "เวิร์กชอป",
        reason:
          "พบมากในงานอบรม สัมมนา และกิจกรรมการเรียนรู้"
      },

      {
        rank: 7,
        wrong: "แมพ",
        correct: "แมป",
        reason:
          "พบในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์"
      },

      {
        rank: 8,
        wrong: "ถาปัตย์",
        correct: "สถาปัตย์",
        reason:
          "เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษา"
      },

      {
        rank: 9,
        wrong: "อยู่ดี กรีนดี",
        correct: "อยู่ดีกินดี",
        reason:
          "เป็นการเล่นคำที่พบเฉพาะในบางแคมเปญหรือกิจกรรม"
      },

      {
        rank: 10,
        wrong: "นมโสด",
        correct: "นมสด",
        reason:
          "เป็นคำเล่นที่ใช้ในบางร้านหรือแคมเปญการตลาด"
      }

    ];


    /* ==========================================
       GAME STATE
    ========================================== */

    let cards = [];
    let selected = [];
    let solved = new Set();

    let score = 0;


    /* ==========================================
       ELEMENTS
    ========================================== */

    const cardsContainer =
      document.getElementById("cards");

    const scoreElement =
      document.getElementById("score");

    const progressText =
      document.getElementById("progressText");

    const progressFill =
      document.getElementById("progressFill");

    const clearBtn =
      document.getElementById("clearBtn");

    const checkBtn =
      document.getElementById("checkBtn");

    const restartBtn =
      document.getElementById("restartBtn");

    const modal =
      document.getElementById("modal");

    const finalScore =
      document.getElementById("finalScore");

    const playAgainBtn =
      document.getElementById("playAgainBtn");


    /* ==========================================
       SHUFFLE
    ========================================== */

    function shuffle(array) {

      const result = [...array];

      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }

      return result;
    }


    /* ==========================================
       NEXT AVAILABLE RANK
    ========================================== */

    function getNextAvailableRank() {

      for (
        let rank = 1;
        rank <= WORDS.length;
        rank++
      ) {

        const alreadySolved =
          [...solved].some(
            index =>
              cards[index].rank === rank
          );

        const alreadySelected =
          selected.some(
            item =>
              item.number === rank
          );

        if (
          !alreadySolved &&
          !alreadySelected
        ) {

          return rank;

        }

      }

      return null;
    }


    /* ==========================================
       RENDER GAME
    ========================================== */

    function renderGame() {

      cardsContainer.innerHTML = "";

      cards.forEach(
        (item, index) => {

          const card =
            document.createElement("div");

          card.className = "card";

          card.dataset.index = index;


          /*
            วงกลมเลขอันดับ
            แสดงเฉพาะเมื่อถูกต้อง
          */

          const rankCircle =
            document.createElement("div");

          rankCircle.className =
            "rank-circle";

          rankCircle.textContent =
            item.rank;


          /*
            เนื้อหาการ์ด
          */

          const content =
            document.createElement("div");

          content.className =
            "card-content";


          /*
            คำศัพท์
          */

          const word =
            document.createElement("div");

          word.className =
            "word";

          word.textContent =
            item.wrong;


          /*
            เหตุผล
          */

          const reason =
            document.createElement("div");

          reason.className =
            "reason";

          reason.textContent =
            item.reason;


          content.appendChild(word);
          content.appendChild(reason);

          card.appendChild(rankCircle);
          card.appendChild(content);

          cardsContainer.appendChild(card);


          /*
            ถ้าตอบถูกแล้ว
          */

          if (solved.has(index)) {

            card.classList.add("locked");

            word.textContent =
              item.correct;

          }


          /*
            คลิกการ์ด
          */

          card.addEventListener(
            "click",
            () => selectCard(index)
          );

        }
      );

      updateUI();

    }


    /* ==========================================
       SELECT CARD
    ========================================== */

    function selectCard(index) {

      if (solved.has(index)) {
        return;
      }


      /*
        ถ้าเลือกใบเดิมอีกครั้ง
        = ยกเลิก
      */

      const existing =
        selected.findIndex(
          item =>
            item.index === index
        );


      if (existing !== -1) {

        selected.splice(existing, 1);

        updateCardStyles();

        updateUI();

        return;

      }


      /*
        เลือกอันดับถัดไป
      */

      const nextRank =
        getNextAvailableRank();

      if (nextRank === null) {
        return;
      }


      selected.push({

        index: index,

        number: nextRank

      });


      updateCardStyles();

      updateUI();

    }


    /* ==========================================
       CARD STYLES
    ========================================== */

    function updateCardStyles() {

      const allCards =
        document.querySelectorAll(".card");

      allCards.forEach(
        (card, index) => {

          card.classList.remove(
            "selected"
          );

          if (
            solved.has(index)
          ) {

            card.classList.add(
              "locked"
            );

            return;

          }


          const selectedItem =
            selected.find(
              item =>
                item.index === index
            );


          if (selectedItem) {

            card.classList.add(
              "selected"
            );

          }

        }
      );

    }


    /* ==========================================
       CHECK ANSWERS
    ========================================== */

    function checkAnswers() {

      const unsolvedCount =
        cards.length - solved.size;


      /*
        ต้องเลือกครบทุกใบที่เหลือ
      */

      if (
        selected.length !==
        unsolvedCount
      ) {

        return;

      }


      const wrongIndexes = [];


      selected.forEach(
        selection => {

          const item =
            cards[selection.index];


          /*
            เช็กจาก rank ของคำ
            ไม่ใช่ตำแหน่งของการ์ด
          */

          if (
            selection.number ===
            item.rank
          ) {

            solved.add(
              selection.index
            );

            score++;

          }
          else {

            wrongIndexes.push(
              selection.index
            );

          }

        }
      );


      /*
        ล้าง selection
        เพื่อให้รอบใหม่เริ่มจาก
        อันดับที่ยังเหลือ
      */

      selected = [];


      renderGame();


      /*
        แสดงการ์ดที่ตอบผิดเป็นสีแดง
      */

      wrongIndexes.forEach(
        index => {

          const card =
            document.querySelector(
              `.card[data-index="${index}"]`
            );

          if (!card) return;

          card.classList.add("wrong");

          setTimeout(
            () => {

              card.classList.remove(
                "wrong"
              );

            },
            450
          );

        }
      );


      /*
        จบเกม
      */

      if (
        solved.size ===
        cards.length
      ) {

        setTimeout(
          showCompletion,
          500
        );

      }

    }


    /* ==========================================
       CLEAR
    ========================================== */

    function clearSelection() {

      selected = [];

      updateCardStyles();

      updateUI();

    }


    /* ==========================================
       UPDATE UI
    ========================================== */

    function updateUI() {

      scoreElement.textContent =
        score;

      progressText.textContent =
        `${solved.size} / ${cards.length}`;

      progressFill.style.width =
        `${(solved.size / cards.length) * 100}%`;


      /*
        เปิดปุ่มตรวจคำตอบ
        เมื่อเลือกครบทุกใบที่ยังไม่ถูก
      */

      const unsolvedCount =
        cards.length - solved.size;

      checkBtn.disabled =
        selected.length !==
        unsolvedCount;

    }


    /* ==========================================
       COMPLETION
    ========================================== */

    function showCompletion() {

      finalScore.textContent =
        `${score} / ${cards.length}`;

      modal.classList.add("show");

    }


    /* ==========================================
       NEW GAME
    ========================================== */

    function newGame() {

      modal.classList.remove(
        "show"
      );

      score = 0;

      selected = [];

      solved = new Set();

      cards = shuffle(WORDS);

      renderGame();

    }


    /* ==========================================
       BUTTON EVENTS
    ========================================== */

    clearBtn.addEventListener(
      "click",
      clearSelection
    );

    checkBtn.addEventListener(
      "click",
      checkAnswers
    );

    restartBtn.addEventListener(
      "click",
      newGame
    );

    playAgainBtn.addEventListener(
      "click",
      newGame
    );


    /* ==========================================
       START
    ========================================== */

    newGame();

  </script>

</body>
</html>
