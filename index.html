<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>จัดอันดับคำไทยให้ถูกต้อง</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Kanit", sans-serif;
    }

    body {
      min-height: 100dvh;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%, rgba(124, 58, 237, .28), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(59, 130, 246, .22), transparent 28%),
        linear-gradient(135deg, #090b18, #11152b 55%, #090b18);
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      min-height: 100dvh;
      padding: clamp(12px, 2vw, 28px);
    }

    .container {
      width: min(1800px, 100%);
      margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: clamp(14px, 1.5vw, 22px);
      margin-bottom: 14px;

      background: rgba(20, 24, 48, .72);
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 22px;
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    }

    .brand {
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      margin-bottom: 5px;

      border-radius: 999px;
      background: rgba(139, 92, 246, .18);
      border: 1px solid rgba(167, 139, 250, .35);

      color: #c4b5fd;
      font-size: clamp(10px, 1vw, 14px);
      font-weight: 600;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 2.7vw, 42px);
      line-height: 1.15;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 5px;
      color: #aab3cc;
      font-size: clamp(12px, 1.15vw, 17px);
    }

    /* =========================
       HUD
    ========================= */

    .hud {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .stat {
      min-width: 105px;
      padding: 10px 16px;
      text-align: center;

      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 15px;
    }

    .stat-label {
      color: #929bb7;
      font-size: 12px;
    }

    .stat-value {
      margin-top: 1px;
      color: #fff;
      font-size: clamp(20px, 2vw, 29px);
      font-weight: 700;
      line-height: 1;
    }

    /* =========================
       INSTRUCTION
    ========================= */

    .instruction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-bottom: 14px;
      padding: 10px 16px;

      border-radius: 14px;
      background: rgba(255, 255, 255, .045);
      border: 1px solid rgba(255, 255, 255, .07);
    }

    .instruction-text {
      color: #c9d0e3;
      font-size: clamp(12px, 1.05vw, 16px);
    }

    .instruction strong {
      color: #d8ccff;
    }

    /* =========================
       BOARD
    ========================= */

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(150px, 1fr));
      gap: clamp(10px, 1vw, 18px);

      width: 100%;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      position: relative;
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: clamp(18px, 2vw, 30px);

      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, .10);

      background:
        linear-gradient(
          145deg,
          rgba(34, 39, 72, .96),
          rgba(22, 26, 52, .96)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .04),
        0 12px 28px rgba(0, 0, 0, .20);

      cursor: pointer;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .card:hover:not(.locked) {
      transform: translateY(-3px);
      border-color: rgba(167, 139, 250, .5);
      box-shadow:
        0 15px 35px rgba(0, 0, 0, .28),
        0 0 24px rgba(124, 58, 237, .13);
    }

    .card.selected {
      transform: translateY(-4px);
      border-color: #a78bfa;
      background:
        linear-gradient(
          145deg,
          rgba(76, 55, 135, .95),
          rgba(37, 33, 78, .98)
        );

      box-shadow:
        0 15px 35px rgba(0, 0, 0, .3),
        0 0 30px rgba(139, 92, 246, .25);
    }

    .card.locked {
      cursor: default;
      border-color: rgba(34, 197, 94, .65);

      background:
        linear-gradient(
          145deg,
          rgba(20, 73, 54, .96),
          rgba(17, 51, 45, .98)
        );

      box-shadow:
        0 10px 30px rgba(0, 0, 0, .25),
        0 0 22px rgba(34, 197, 94, .13);
    }

    /* =========================
       RANK CIRCLE
       ยังคงแสดงมุมการ์ด
    ========================= */

    .number {
      position: absolute;
      top: 12px;
      left: 12px;

      width: clamp(30px, 2.5vw, 42px);
      height: clamp(30px, 2.5vw, 42px);

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #d8ccff;
      background: rgba(124, 58, 237, .16);
      border: 1px solid rgba(167, 139, 250, .45);

      font-size: clamp(14px, 1.25vw, 19px);
      font-weight: 700;

      z-index: 2;
    }

    .card.selected .number {
      color: #fff;
      background: #7c3aed;
      border-color: #a78bfa;
      box-shadow: 0 0 18px rgba(124, 58, 237, .45);
    }

    .card.locked .number {
      color: #fff;
      background: #16a34a;
      border-color: #4ade80;
      box-shadow: 0 0 16px rgba(34, 197, 94, .3);
    }

    /* =========================
       CARD CONTENT
    ========================= */

    .card-content {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: clamp(8px, 1vw, 14px);

      text-align: center;
    }

    .word {
      width: 100%;

      color: #fff;

      font-size: clamp(22px, 2.2vw, 35px);
      line-height: 1.25;
      font-weight: 700;

      text-align: center;

      /* ทุกคำใช้ขนาดเดียวกัน */
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    /* =========================
       REASON
    ========================= */

    .answer {
      width: 100%;
      display: none;

      animation: reasonIn .25s ease;
    }

    .card.locked .answer {
      display: block;
    }

    .reason {
      width: 100%;

      color: #d9e2ed;

      font-size: clamp(16px, 1.3vw, 21px);
      line-height: 1.5;
      font-weight: 500;

      text-align: center;
    }

    @keyframes reasonIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       WRONG
    ========================= */

    .card.wrong {
      animation: wrongShake .35s ease;
      border-color: #ef4444;
      box-shadow:
        0 0 24px rgba(239, 68, 68, .22);
    }

    @keyframes wrongShake {
      0%, 100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(7px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(5px);
      }
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      margin-top: 14px;
    }

    .btn {
      border: 0;
      border-radius: 13px;

      padding: 10px 20px;

      color: #fff;
      font-size: clamp(13px, 1.1vw, 16px);
      font-weight: 600;

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease,
        box-shadow .15s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .btn-clear {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .1);
    }

    .btn-check {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      box-shadow: 0 8px 20px rgba(99, 102, 241, .22);
    }

    .btn-new {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-wrap {
      width: min(600px, 100%);
      margin: 12px auto 0;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;

      color: #858fab;
      font-size: 12px;
    }

    .progress {
      width: 100%;
      height: 7px;

      overflow: hidden;

      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background: linear-gradient(
        90deg,
        #7c3aed,
        #6366f1,
        #22c55e
      );

      transition: width .3s ease;
    }

    /* =========================
       COMPLETION
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(3, 5, 15, .76);
      backdrop-filter: blur(10px);

      z-index: 100;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: min(520px, 100%);

      padding: 35px 28px;

      text-align: center;

      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(32, 38, 75, .98),
          rgba(17, 21, 46, .98)
        );

      border: 1px solid rgba(167, 139, 250, .35);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, .5),
        0 0 50px rgba(124, 58, 237, .15);
    }

    .modal-icon {
      font-size: 54px;
      margin-bottom: 8px;
    }

    .modal h2 {
      margin: 0;
      font-size: clamp(25px, 3vw, 36px);
    }

    .modal p {
      margin: 8px 0 22px;
      color: #aab3cc;
      font-size: 16px;
    }

    .final-score {
      margin-bottom: 22px;
      font-size: 24px;
      font-weight: 700;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1100px) and (orientation: landscape) {
      .app {
        padding: 10px;
      }

      .header {
        padding: 12px;
        margin-bottom: 8px;
        border-radius: 16px;
      }

      .instruction {
        margin-bottom: 8px;
        padding: 7px 12px;
      }

      .board {
        gap: 8px;
        grid-template-rows: repeat(2, minmax(125px, 1fr));
      }

      .card {
        border-radius: 15px;
        padding: 14px;
      }

      .word {
        font-size: clamp(19px, 2.5vw, 29px);
      }

      .reason {
        font-size: clamp(13px, 1.55vw, 17px);
      }

      .controls {
        margin-top: 8px;
      }

      .progress-wrap {
        margin-top: 6px;
      }
    }

    /* =========================
       PORTRAIT
    ========================= */

    @media (orientation: portrait) {
      body {
        overflow-y: auto;
      }

      .app {
        min-height: 100dvh;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .hud {
        width: 100%;
      }

      .stat {
        flex: 1;
      }

      .board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: none;
      }

      .card {
        min-height: 170px;
      }
    }

    /* =========================
       PHONE
    ========================= */

    @media (max-width: 600px) {
      .app {
        padding: 9px;
      }

      .header {
        padding: 12px;
        border-radius: 16px;
      }

      .instruction {
        align-items: flex-start;
        padding: 9px 11px;
      }

      .board {
        gap: 8px;
      }

      .card {
        min-height: 150px;
        padding: 14px 10px;
        border-radius: 15px;
      }

      .number {
        top: 8px;
        left: 8px;
      }

      .word {
        font-size: 22px;
      }

      .reason {
        font-size: 15px;
      }

      .controls {
        flex-wrap: wrap;
      }

      .btn {
        flex: 1;
        min-width: 120px;
      }
    }

    @media (max-width: 330px) {
      .board {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 140px;
      }
    }

    /* =========================
       LANDSCAPE NO SCROLL
    ========================= */

    @media (orientation: landscape) {
      body {
        overflow: hidden;
      }

      .app {
        height: 100dvh;
        overflow: hidden;
      }

      .container {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .board {
        flex: 1;
        min-height: 0;
      }

      .card {
        min-height: 0;
      }
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="container">

      <!-- HEADER -->
      <header class="header">

        <div class="brand">
          <div class="badge">THAI WORD CHALLENGE</div>

          <h1>จัดอันดับคำไทยให้ถูกต้อง</h1>

          <div class="subtitle">
            เลือกคำที่คิดว่าสะกดถูก แล้วจัดอันดับให้ครบทั้ง 10 คำ
          </div>
        </div>

        <div class="hud">

          <div class="stat">
            <div class="stat-label">คะแนนของคุณ</div>
            <div class="stat-value" id="score">0</div>
          </div>

          <div class="stat">
            <div class="stat-label">ตอบถูกแล้ว</div>
            <div class="stat-value">
              <span id="solvedCount">0</span>/10
            </div>
          </div>

        </div>

      </header>

      <!-- INSTRUCTION -->
      <div class="instruction">
        <div class="instruction-text">
          วิธีเล่น:
          <strong>แตะคำเพื่อเลือกอันดับ</strong>
          • แตะซ้ำเพื่อยกเลิก
          • เลือกครบแล้วกด
          <strong>ตรวจคำตอบ</strong>
        </div>
      </div>

      <!-- BOARD -->
      <section class="board" id="board"></section>

      <!-- CONTROLS -->
      <div class="controls">

        <button
          class="btn btn-clear"
          id="clearBtn"
          onclick="clearSelected()"
        >
          ↺ ล้างคำตอบ
        </button>

        <button
          class="btn btn-check"
          id="checkBtn"
          onclick="checkAnswers()"
          disabled
        >
          ✓ ตรวจคำตอบ
        </button>

        <button
          class="btn btn-new"
          onclick="newGame()"
        >
          ⟳ เริ่มเกมใหม่
        </button>

      </div>

      <!-- PROGRESS -->
      <div class="progress-wrap">

        <div class="progress-info">
          <span>ความคืบหน้า</span>
          <span id="progressText">0 / 10</span>
        </div>

        <div class="progress">
          <div
            class="progress-bar"
            id="progressBar"
          ></div>
        </div>

      </div>

    </div>
  </main>

  <!-- COMPLETION -->
  <div class="overlay" id="overlay">

    <div class="modal">

      <div class="modal-icon">🏆</div>

      <h2>ยินดีด้วย!</h2>

      <p>
        คุณจัดอันดับคำได้ครบทั้ง 10 คำแล้ว
      </p>

      <div class="final-score">
        คะแนน: <span id="finalScore">0</span> / 10
      </div>

      <button
        class="btn btn-new"
        onclick="newGame()"
      >
        ⟳ เล่นใหม่
      </button>

    </div>

  </div>

  <script>
    /* =========================================
       DATA
    ========================================= */

    const WORDS = [
      {
        common: "สเต็ก",

        rank: 1,
        reason:
          "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา ทำให้ผู้คนคุ้นเคยกับคำนี้และมีโอกาสพบรูปสะกดที่หลากหลายสูง"
      },
      {

      {

      },
      {

        reason:

      },
      {

        reason:

      },
      {
        common: "เวิร์กช็อป",
        correct: "เวิร์กชอป",
        rank: 6,
        reason:
          "พบในงานอบรม สัมมนา และกิจกรรมการเรียนรู้เป็นหลัก จึงมีการใช้งานเฉพาะบริบทมากกว่าคำอันดับก่อนหน้า"
      },
      {
        common: "แมพ",
        correct: "แมป",
        rank: 7,
        reason:
          "พบมากในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์บางกลุ่ม จึงมีการใช้จำกัดอยู่ในกลุ่มผู้ใช้เฉพาะทางมากกว่า"
      },
      {
        common: "ถาปัตย์",
        correct: "สถาปัตย์",
        rank: 8,
        reason:
          "เป็นคำที่เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษาเป็นหลัก จึงพบในภาษาทั่วไปน้อยกว่าคำที่อยู่ในอันดับต้น ๆ"
      },
      {
        common: "อยู่ดี กรีนดี",
        correct: "อยู่ดีกินดี",
        rank: 9,
        reason:
          "เป็นการเล่นคำที่เกิดขึ้นเฉพาะในบางแคมเปญหรือกิจกรรม จึงไม่ได้มีการใช้แพร่หลายในชีวิตประจำวันเหมือนคำอื่น"
      },
      {
        common: "นมโสด",
        correct: "นมสด",
        rank: 10,
        reason:
          "เป็นคำที่ถูกนำไปดัดแปลงเป็นคำเล่นในบางร้านหรือแคมเปญการตลาด จึงพบเฉพาะกรณีและไม่ใช่การสะกดผิดที่เกิดขึ้นทั่วไป"
      }
    ];

    /* =========================================
       STATE
    ========================================= */

    let cards = [];
    let selected = [];
    let solved = new Set();
    let wrongCards = new Set();
    let score = 0;

    /* =========================================
       SHUFFLE
    ========================================= */

    function shuffle(array) {
      const arr = [...array];

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }

    /* =========================================
       FIND NEXT AVAILABLE RANK
       สำคัญ:
       อันดับที่ตอบถูกแล้วจะไม่ถูกใช้ซ้ำ
    ========================================= */

    function getNextAvailableRank() {

      for (let rank = 1; rank <= WORDS.length; rank++) {

        const alreadySolved = [...solved].some(
          index => cards[index].rank === rank
        );

        const alreadySelected = selected.some(
          item => item.number === rank
        );

        if (!alreadySolved && !alreadySelected) {
          return rank;
        }
      }

      return null;
    }

    /* =========================================
       RENDER
    ========================================= */

    function render() {

      const board = document.getElementById("board");

      board.innerHTML = "";

      cards.forEach((item, index) => {

        const card = document.createElement("div");

        card.className = "card";

        const isSolved = solved.has(index);

        if (isSolved) {
          card.classList.add("locked");
        }

        if (wrongCards.has(index)) {
          card.classList.add("wrong");
        }

        /* วงกลม + เลขอันดับ
           ยังคงแสดงมุมการ์ด */
        const number = document.createElement("div");

        number.className = "number";

        const selectedItem = selected.find(
          item => item.index === index
        );

        if (selectedItem) {
          number.textContent = selectedItem.number;
        } else if (isSolved) {
          number.textContent = item.rank;
        } else {
          number.textContent = "○";
        }

        /* CARD CONTENT */

        const content = document.createElement("div");

        content.className = "card-content";

        /* คำศัพท์ */

        const word = document.createElement("div");

        word.className = "word";

        if (isSolved) {
          word.textContent = item.correct;
        } else {
          word.textContent = item.common;
        }

        /* เหตุผล */

        const answer = document.createElement("div");

        answer.className = "answer";

        answer.innerHTML = `
          <div class="reason">
            ${item.reason}
          </div>
        `;

        content.appendChild(word);
        content.appendChild(answer);

        card.appendChild(number);
        card.appendChild(content);

        if (!isSolved) {
          card.addEventListener("click", () => {
            selectCard(index);
          });
        }

        board.appendChild(card);
      });

      updateUI();
    }

    /* =========================================
       SELECT CARD
    ========================================= */

    function selectCard(index) {

      if (solved.has(index)) {
        return;
      }

      const existing = selected.find(
        item => item.index === index
      );

      /* ถ้าเลือกไว้แล้ว → ยกเลิก */
      if (existing) {

        selected = selected.filter(
          item => item.index !== index
        );

        wrongCards.delete(index);

        render();

        return;
      }

      const nextRank = getNextAvailableRank();

      if (nextRank === null) {
        return;
      }

      selected.push({
        index: index,
        number: nextRank
      });

      wrongCards.delete(index);

      render();
    }

    /* =========================================
       CHECK ANSWERS
    ========================================= */

    function checkAnswers() {

      const unsolvedCount =
        cards.length - solved.size;

      if (selected.length !== unsolvedCount) {
        return;
      }

      const correctIndexes = [];

      selected.forEach(selection => {

        const item = cards[selection.index];

        if (selection.number === item.rank) {

          correctIndexes.push(selection.index);

          solved.add(selection.index);

          score++;

        } else {

          wrongCards.add(selection.index);
        }
      });

      /* ล้าง selection
         แต่เก็บ solved ไว้ */

      selected = [];

      render();

      /* เล่นจบ */

      if (solved.size === WORDS.length) {

        setTimeout(() => {

          document.getElementById("finalScore")
            .textContent = score;

          document.getElementById("overlay")
            .classList.add("show");

        }, 450);
      }
    }

    /* =========================================
       CLEAR SELECTED
       ล้างเฉพาะคำที่กำลังเลือก
    ========================================= */

    function clearSelected() {

      selected = [];

      wrongCards.clear();

      render();
    }

    /* =========================================
       NEW GAME
    ========================================= */

    function newGame() {

      document.getElementById("overlay")
        .classList.remove("show");

      cards = shuffle(WORDS);

      selected = [];

      solved = new Set();

      wrongCards = new Set();

      score = 0;

      render();
    }

    /* =========================================
       UPDATE UI
    ========================================= */

    function updateUI() {

      document.getElementById("score")
        .textContent = score;

      document.getElementById("solvedCount")
        .textContent = solved.size;

      document.getElementById("progressText")
        .textContent =
        `${solved.size} / ${WORDS.length}`;

      const progress =
        (solved.size / WORDS.length) * 100;

      document.getElementById("progressBar")
        .style.width = `${progress}%`;

      const unsolvedCount =
        cards.length - solved.size;

      document.getElementById("checkBtn").disabled =
        selected.length !== unsolvedCount ||
        unsolvedCount === 0;

      document.getElementById("clearBtn").disabled =
        selected.length === 0;
    }

    /* =========================================
       START
    ========================================= */

    newGame();
  </script>

</body>
