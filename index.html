<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>จัดอันดับคำไทยให้ถูกต้อง</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap');

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg1: #0b1024;
  --bg2: #171d3d;

  --purple: #7c5cff;
  --purple-light: #a78bfa;

  --green: #27d17f;
  --red: #ff5c7a;

  --white: #ffffff;
  --muted: #aeb7d5;

  --glass: rgba(255,255,255,.075);
  --border: rgba(255,255,255,.13);
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;

  font-family: "Kanit", sans-serif;
  color: var(--white);

  background:
    radial-gradient(
      circle at 10% 5%,
      rgba(124,92,255,.28),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(0,200,255,.12),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      var(--bg1),
      var(--bg2)
    );
}

/* =========================
   APP
========================= */

.app {
  position: relative;
  z-index: 1;

  width: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  padding:
    clamp(9px, 1.5vw, 24px)
    clamp(12px, 2.5vw, 40px);
}

/* =========================
   HEADER
========================= */

.header {
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;

  margin-bottom:
    clamp(7px, 1.2vh, 16px);
}

.brand {
  min-width: 0;
}

.badge {
  display: inline-flex;
  align-items: center;

  padding: 4px 11px;

  border-radius: 999px;

  background: rgba(124,92,255,.17);

  border: 1px solid rgba(167,139,250,.28);

  color: #ddd5ff;

  font-size:
    clamp(9px, .8vw, 13px);

  font-weight: 600;
}

.badge::before {
  content: "✦";
  margin-right: 6px;
}

h1 {
  margin: 5px 0 0;

  font-size:
    clamp(21px, 3vw, 43px);

  line-height: 1;

  font-weight: 800;

  letter-spacing: -.5px;
}

.subtitle {
  margin: 5px 0 0;

  color: var(--muted);

  font-size:
    clamp(9px, 1vw, 15px);
}

/* =========================
   HUD
========================= */

.hud {
  flex-shrink: 0;

  display: flex;
  gap: 8px;
}

.stat {
  min-width:
    clamp(78px, 8vw, 125px);

  padding: 8px 12px;

  border-radius: 15px;

  text-align: center;

  background: var(--glass);

  border: 1px solid var(--border);

  backdrop-filter: blur(15px);

  box-shadow:
    0 8px 25px rgba(0,0,0,.15);
}

.stat-label {
  color: var(--muted);

  font-size:
    clamp(8px, .75vw, 12px);
}

.stat-value {
  margin-top: -2px;

  font-size:
    clamp(20px, 2vw, 30px);

  line-height: 1;

  font-weight: 800;
}

/* =========================
   INSTRUCTION
========================= */

.instruction {
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  padding:
    clamp(6px, .8vh, 10px)
    14px;

  margin-bottom:
    clamp(6px, 1vh, 13px);

  border-radius: 13px;

  background: rgba(255,255,255,.05);

  border: 1px solid rgba(255,255,255,.08);
}

.instruction-text {
  color: #d5daed;

  font-size:
    clamp(9px, .9vw, 14px);
}

.instruction-text strong {
  color: white;
}

/* =========================
   GAME BOARD
========================= */

.board {
  flex: 1;

  min-height: 0;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  grid-template-rows:
    repeat(2, minmax(0, 1fr));

  gap:
    clamp(7px, 1vw, 15px);
}

/* =========================
   CARD
========================= */

.card {
  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    clamp(12px, 1.4vw, 24px);

  border-radius:
    clamp(14px, 1.4vw, 23px);

  border: 1px solid var(--border);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.045)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 10px 25px rgba(0,0,0,.18);

  cursor: pointer;

  overflow: hidden;

  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.card::before {
  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.09),
      transparent 45%
    );
}

.card:hover {
  transform: translateY(-4px);

  border-color:
    rgba(167,139,250,.55);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.1),
    0 15px 35px rgba(0,0,0,.25),
    0 0 25px rgba(124,92,255,.12);
}

.card.selected {
  transform:
    translateY(-5px)
    scale(1.015);

  border-color:
    var(--purple-light);

  background:
    linear-gradient(
      145deg,
      rgba(124,92,255,.31),
      rgba(124,92,255,.10)
    );

  box-shadow:
    0 0 0 2px rgba(124,92,255,.15),
    0 15px 35px rgba(0,0,0,.28),
    0 0 35px rgba(124,92,255,.22);
}

.card.locked {
  cursor: default;

  border-color:
    rgba(39,209,127,.55);

  background:
    linear-gradient(
      145deg,
      rgba(39,209,127,.20),
      rgba(39,209,127,.06)
    );

  box-shadow:
    0 0 0 2px rgba(39,209,127,.08),
    0 10px 30px rgba(0,0,0,.2),
    0 0 25px rgba(39,209,127,.12);
}

.card.locked:hover {
  transform: none;
}

.card.wrong {
  border-color: var(--red);

  background:
    linear-gradient(
      145deg,
      rgba(255,92,122,.25),
      rgba(255,92,122,.07)
    );

  animation:
    shake .38s ease;
}

/* =========================
   NUMBER
========================= */

.number {
  position: absolute;

  top:
    clamp(8px, 1vw, 14px);

  left:
    clamp(8px, 1vw, 14px);

  width:
    clamp(28px, 2.6vw, 42px);

  height:
    clamp(28px, 2.6vw, 42px);

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  color: #dce1f4;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.13);

  font-size:
    clamp(12px, 1.1vw, 17px);

  font-weight: 800;
}

.card.selected .number {
  color: white;

  background:
    var(--purple);

  border-color:
    transparent;

  box-shadow:
    0 0 18px rgba(124,92,255,.45);
}

.card.locked .number {
  color: white;

  background:
    var(--green);

  border-color:
    transparent;

  box-shadow:
    0 0 18px rgba(39,209,127,.35);
}

/* =========================
   WORD
========================= */

.word {
  width: 100%;

  text-align: center;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  font-size:
    clamp(18px, 2vw, 35px);

  font-weight: 700;

  line-height: 1.05;

  transition:
    font-size .1s linear;
}

/* =========================
   ANSWER
========================= */

.answer {
  position: absolute;

  left: 9px;
  right: 9px;

  bottom: 8px;

  text-align: center;

  opacity: 0;

  transform:
    translateY(8px);

  transition: .25s ease;

  pointer-events: none;
}

.card.locked .answer {
  opacity: 1;

  transform:
    translateY(0);
}

.correct-label {
  color: var(--green);

  font-size:
    clamp(8px, .75vw, 12px);

  font-weight: 700;
}

.correct-word {
  margin-top: 1px;

  color: white;

  font-size:
    clamp(10px, .9vw, 14px);

  font-weight: 700;
}

.reason {
  color: #b7c0bc;

  font-size:
    clamp(7px, .65vw, 11px);

  line-height: 1.15;
}

/* =========================
   CONTROLS
========================= */

.controls {
  flex-shrink: 0;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 9px;

  margin-top:
    clamp(7px, 1.1vh, 14px);
}

button {
  font-family: inherit;

  color: white;

  border: 0;

  cursor: pointer;

  transition: .18s ease;
}

.btn-main {
  min-width:
    clamp(130px, 15vw, 220px);

  padding:
    clamp(9px, 1vh, 13px)
    22px;

  border-radius: 13px;

  font-size:
    clamp(11px, 1vw, 15px);

  font-weight: 700;

  background:
    linear-gradient(
      135deg,
      #7c5cff,
      #9b7cff
    );

  box-shadow:
    0 8px 22px rgba(124,92,255,.28);
}

.btn-main:hover:not(:disabled) {
  transform:
    translateY(-2px);

  box-shadow:
    0 12px 28px rgba(124,92,255,.4);
}

.btn-main:disabled {
  opacity: .3;

  cursor: not-allowed;

  box-shadow: none;
}

.btn-secondary {
  padding:
    clamp(9px, 1vh, 13px)
    16px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.12);

  font-size:
    clamp(10px, .9vw, 14px);
}

.btn-secondary:hover {
  background:
    rgba(255,255,255,.14);
}

/* =========================
   PROGRESS
========================= */

.progress-wrap {
  flex-shrink: 0;

  margin-top: 6px;
}

.progress-info {
  display: flex;

  justify-content: space-between;

  color: var(--muted);

  font-size:
    clamp(8px, .7vw, 11px);
}

.progress {
  height: 4px;

  margin-top: 4px;

  border-radius: 99px;

  overflow: hidden;

  background:
    rgba(255,255,255,.08);
}

.progress-bar {
  width: 0%;

  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #7c5cff,
      #27d17f
    );

  transition:
    width .35s ease;
}

/* =========================
   COMPLETE
========================= */

.overlay {
  position: fixed;

  inset: 0;

  z-index: 50;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(5,8,22,.75);

  backdrop-filter:
    blur(12px);

  opacity: 0;

  pointer-events: none;

  transition: .3s ease;
}

.overlay.show {
  opacity: 1;

  pointer-events: auto;
}

.complete-card {
  width:
    min(90vw, 500px);

  padding:
    clamp(28px, 5vw, 50px);

  text-align: center;

  border-radius: 28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.055)
    );

  border:
    1px solid rgba(255,255,255,.15);

  box-shadow:
    0 30px 80px rgba(0,0,0,.45);

  animation:
    pop .4s ease;
}

.trophy {
  font-size:
    clamp(45px, 7vw, 75px);
}

.complete-card h2 {
  margin:
    8px 0 4px;

  font-size:
    clamp(25px, 4vw, 40px);
}

.complete-card p {
  margin:
    0 0 22px;

  color:
    var(--muted);

  font-size:
    clamp(12px, 1.2vw, 16px);
}

.final-score {
  margin-bottom: 22px;

  color: #ffd166;

  font-size:
    clamp(35px, 6vw, 60px);

  line-height: 1;

  font-weight: 800;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes shake {

  0%,100% {
    transform: translateX(0);
  }

  20% {
    transform: translateX(-7px);
  }

  40% {
    transform: translateX(7px);
  }

  60% {
    transform: translateX(-5px);
  }

  80% {
    transform: translateX(5px);
  }
}

@keyframes pop {

  from {
    transform: scale(.8);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* =========================
   PORTRAIT
========================= */

@media (orientation: portrait) {

  html,
  body {
    overflow: auto;
  }

  .app {
    min-height: 100dvh;

    height: auto;
  }

  .header {
    align-items: flex-start;
  }

  .hud {
    flex-direction: column;
  }

  .stat {
    min-width: 82px;
  }

  .board {
    flex: none;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    grid-template-rows: none;

    grid-auto-rows:
      minmax(150px, 30vw);
  }

  .controls {
    position: sticky;

    bottom: 0;

    padding:
      10px 0;

    background:
      linear-gradient(
        transparent,
        rgba(16,22,47,.96) 30%
      );
  }
}

/* =========================
   VERY SMALL PHONE
========================= */

@media (max-width: 330px) {

  .board {
    grid-template-columns: 1fr;

    grid-auto-rows: 145px;
  }

  .header {
    gap: 8px;
  }

  .subtitle {
    display: none;
  }

  .hud {
    gap: 5px;
  }

  .stat {
    min-width: 65px;

    padding:
      6px 8px;
  }
}

/* =========================
   SHORT LANDSCAPE
========================= */

@media (orientation: landscape)
and (max-height: 650px) {

  .app {
    padding-top: 6px;
    padding-bottom: 6px;
  }

  .header {
    margin-bottom: 5px;
  }

  .badge,
  .subtitle {
    display: none;
  }

  h1 {
    font-size:
      clamp(18px, 3vw, 27px);
  }

  .stat {
    padding:
      5px 10px;
  }

  .instruction {
    padding:
      5px 10px;

    margin-bottom: 5px;
  }

  .board {
    gap: 6px;
  }

  .card {
    padding: 8px;

    border-radius: 12px;
  }

  .answer {
    bottom: 5px;
  }

  .controls {
    margin-top: 5px;
  }

  .btn-main,
  .btn-secondary {
    padding-top: 7px;
    padding-bottom: 7px;
  }

  .progress-wrap {
    display: none;
  }
}
</style>
</head>


<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="badge">
        THAI WORD CHALLENGE
      </div>

      <h1>
        จัดอันดับคำไทยให้ถูกต้อง
      </h1>

      <p class="subtitle">
        เลือกคำที่คิดว่าสะกดถูก แล้วจัดอันดับให้ครบทั้ง 10 คำ
      </p>

    </div>


    <div class="hud">

      <div class="stat">

        <div class="stat-label">
          คะแนนของคุณ
        </div>

        <div
          class="stat-value"
          id="score"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          ตอบถูกแล้ว
        </div>

        <div class="stat-value">

          <span id="solved">
            0
          </span>/10

        </div>

      </div>

    </div>

  </header>


  <!-- INSTRUCTION -->

  <div class="instruction">

    <div class="instruction-text">

      <strong>วิธีเล่น:</strong>
      แตะคำเพื่อเลือกอันดับ • แตะซ้ำเพื่อยกเลิก

    </div>

    <div class="instruction-text">

      เลือกครบแล้วกด
      <strong>ตรวจคำตอบ</strong>

    </div>

  </div>


  <!-- BOARD -->

  <main
    class="board"
    id="board"
  ></main>


  <!-- BUTTONS -->

  <div class="controls">

    <button
      class="btn-secondary"
      onclick="clearSelected()"
    >
      ↺ ล้างคำตอบ
    </button>


    <button
      class="btn-main"
      id="checkBtn"
      onclick="checkAnswers()"
      disabled
    >
      ✓ ตรวจคำตอบ
    </button>


    <button
      class="btn-secondary"
      onclick="newGame()"
    >
      ⟳ เริ่มเกมใหม่
    </button>

  </div>


  <!-- PROGRESS -->

  <div class="progress-wrap">

    <div class="progress-info">

      <span>
        ความคืบหน้า
      </span>

      <span id="progressText">
        0%
      </span>

    </div>

    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

  </div>

</div>


<!-- COMPLETE -->

<div
  class="overlay"
  id="completeOverlay"
>

  <div class="complete-card">

    <div class="trophy">
      🏆
    </div>

    <h2>
      ยินดีด้วย!
    </h2>

    <p>
      คุณจัดอันดับคำได้ครบทั้ง 10 คำแล้ว
    </p>

    <div class="final-score">

      <span id="finalScore">
        10
      </span>/10

    </div>

    <button
      class="btn-main"
      onclick="newGame()"
    >
      ⟳ เล่นอีกครั้ง
    </button>

  </div>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

const WORDS = [

  {
    rank: 1,
    wrong: "สเต็ก",
    correct: "สเต๊ก",
    reason:
      "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา"
  },

  {
    rank: 2,
    wrong: "เฟสบุ๊ค",
    correct: "เฟซบุ๊ก",
    reason:
      "ใช้แพร่หลายในชีวิตประจำวันและสื่อออนไลน์"
  },

  {
    rank: 3,
    wrong: "คอมเม้นต์",
    correct: "คอมเมนต์",
    reason:
      "ใช้บ่อยในโซเชียลมีเดียและช่องแสดงความคิดเห็น"
  },

  {
    rank: 4,
    wrong: "ลิงค์",
    correct: "ลิงก์",
    reason:
      "พบเป็นประจำในเว็บไซต์ เอกสาร และการสื่อสารออนไลน์"
  },

  {
    rank: 5,
    wrong: "บูธ",
    correct: "บูท",
    reason:
      "มักพบในงานแสดงสินค้า นิทรรศการ และกิจกรรมต่าง ๆ"
  },

  {
    rank: 6,
    wrong: "เวิร์กช็อป",
    correct: "เวิร์กชอป",
    reason:
      "พบมากในงานอบรม สัมมนา และกิจกรรมการเรียนรู้"
  },

  {
    rank: 7,
    wrong: "แมพ",
    correct: "แมป",
    reason:
      "พบในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์"
  },

  {
    rank: 8,
    wrong: "ถาปัตย์",
    correct: "สถาปัตย์",
    reason:
      "เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษา"
  },

  {
    rank: 9,
    wrong: "อยู่ดี กรีนดี",
    correct: "อยู่ดีกินดี",
    reason:
      "เป็นการเล่นคำที่พบเฉพาะในบางแคมเปญหรือกิจกรรม"
  },

  {
    rank: 10,
    wrong: "นมโสด",
    correct: "นมสด",
    reason:
      "เป็นคำเล่นที่ใช้ในบางร้านหรือแคมเปญการตลาด"
  }

];


/* =====================================================
   GAME VARIABLES
===================================================== */

let cards = [];

let selected = [];

let solved = new Set();

let wrongCards = new Set();

let score = 0;


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;
}


/* =====================================================
   FIND NEXT AVAILABLE RANK
===================================================== */

/*
  จุดสำคัญของระบบใหม่

  ถ้า 1,2,3 ถูกแล้ว
  รอบต่อไปจะเริ่มที่ 4

  ถ้า 1,2,3,4 ถูกแล้ว
  รอบต่อไปจะเริ่มที่ 5

  ดังนั้นเลขจะไม่ย้อนกลับไปเป็น 1
*/

function getNextAvailableRank() {

  for (
    let rank = 1;
    rank <= WORDS.length;
    rank++
  ) {

    /* เช็กว่าอันดับนี้ตอบถูกไปแล้วหรือยัง */

    const alreadySolved =
      [...solved].some(
        index =>
          cards[index].rank === rank
      );


    /* เช็กว่าอันดับนี้ถูกเลือกในรอบปัจจุบันหรือยัง */

    const alreadySelected =
      selected.some(
        item =>
          item.number === rank
      );


    if (
      !alreadySolved &&
      !alreadySelected
    ) {

      return rank;

    }

  }

  return null;
}


/* =====================================================
   RENDER
===================================================== */

function render() {

  const board =
    document.getElementById("board");

  board.innerHTML = "";


  cards.forEach(
    (item, index) => {

      const card =
        document.createElement("div");

      card.className = "card";


      const isSolved =
        solved.has(index);


      const selection =
        selected.find(
          item =>
            item.index === index
        );


      /* LOCKED */

      if (isSolved) {

        card.classList.add(
          "locked"
        );

      }


      /* SELECTED */

      if (selection) {

        card.classList.add(
          "selected"
        );

      }


      /* WRONG */

      if (
        wrongCards.has(index)
      ) {

        card.classList.add(
          "wrong"
        );

      }


      /* NUMBER */

      const number =
        document.createElement("div");

      number.className =
        "number";


      if (isSolved) {

        /*
          ตอบถูกแล้ว
          แสดงอันดับจริง
        */

        number.textContent =
          item.rank;

      }

      else if (selection) {

        /*
          แสดงอันดับที่ผู้เล่นเลือก
        */

        number.textContent =
          selection.number;

      }

      else {

        number.textContent =
          "○";

      }


      /* WORD */

      const word =
        document.createElement("div");

      word.className =
        "word";

      word.textContent =
        isSolved
          ? item.correct
          : item.wrong;


      /* ANSWER */

      const answer =
        document.createElement("div");

      answer.className =
        "answer";

      answer.innerHTML = `

        <div class="correct-label">
          ✓ ถูกต้อง!
        </div>

        <div class="correct-word">
          อันดับที่ ${item.rank}
          • ${item.correct}
        </div>

        <div class="reason">
          ${item.reason}
        </div>

      `;


      card.appendChild(number);

      card.appendChild(word);

      card.appendChild(answer);


      /*
        การ์ดที่ถูกแล้ว
        คลิกไม่ได้
      */

      if (!isSolved) {

        card.addEventListener(
          "click",
          () =>
            selectCard(index)
        );

      }


      board.appendChild(card);

    }
  );


  fitAllWords();

}


/* =====================================================
   SELECT CARD
===================================================== */

function selectCard(index) {

  /*
    ถ้าถูกแล้ว
    ห้ามเลือกอีก
  */

  if (
    solved.has(index)
  ) {

    return;

  }


  /*
    เช็กว่าการ์ดนี้ถูกเลือกอยู่หรือไม่
  */

  const existingIndex =
    selected.findIndex(
      item =>
        item.index === index
    );


  /*
    ถ้าเลือกอยู่แล้ว
    คลิกซ้ำ = ยกเลิก
  */

  if (
    existingIndex !== -1
  ) {

    selected.splice(
      existingIndex,
      1
    );

  }

  else {

    /*
      หาอันดับถัดไป
      จากอันดับที่ยังไม่ถูกใช้
    */

    const nextRank =
      getNextAvailableRank();


    if (
      nextRank === null
    ) {

      return;

    }


    selected.push({

      index: index,

      number: nextRank

    });

  }


  render();

  updateUI();

}


/* =====================================================
   CHECK ANSWERS
===================================================== */

function checkAnswers() {

  if (
    selected.length === 0
  ) {

    return;

  }


  /*
    ตรวจทุกใบที่เลือก
  */

  selected.forEach(
    selection => {

      const index =
        selection.index;

      const item =
        cards[index];


      /*
        สำคัญมาก

        ตรวจจาก rank จริงของคำ
        ไม่ใช่ตำแหน่งของการ์ด
      */

      if (
        selection.number === item.rank
      ) {

        /*
          ตอบถูก

          เพิ่มเข้า solved
          แล้วจะถูกล็อกถาวร
        */

        solved.add(index);

        score++;

      }

      else {

        /*
          ตอบผิด

          แสดงสีแดงชั่วคราว
          แล้วสามารถตอบใหม่ได้
        */

        wrongCards.add(index);

      }

    }
  );


  /*
    สำคัญ:

    หลังตรวจแล้ว
    ล้างเฉพาะรายการที่เลือกในรอบนี้

    อันดับที่ถูกแล้วอยู่ใน solved
    จึงไม่ถูกนำกลับมาใช้อีก
  */

  selected = [];


  render();

  updateUI();


  /*
    เอาสีแดงออกหลังจาก 700ms
  */

  setTimeout(
    () => {

      wrongCards.clear();

      render();

    },
    700
  );


  /*
    ตรวจว่าจบเกมหรือยัง
  */

  if (
    solved.size === WORDS.length
  ) {

    setTimeout(
      () => {

        document
          .getElementById(
            "finalScore"
          )
          .textContent = score;


        document
          .getElementById(
            "completeOverlay"
          )
          .classList.add("show");

      },
      850
    );

  }

}


/* =====================================================
   CLEAR SELECTED
===================================================== */

function clearSelected() {

  /*
    ล้างเฉพาะคำที่กำลังเลือก

    ไม่แตะคำที่ตอบถูกแล้ว
  */

  selected = [];

  wrongCards.clear();

  render();

  updateUI();

}


/* =====================================================
   NEW GAME
===================================================== */

function newGame() {

  /*
    รีเซ็ตทุกอย่าง
  */

  solved.clear();

  wrongCards.clear();

  selected = [];

  score = 0;


  /*
    สุ่มการ์ดใหม่
  */

  cards =
    shuffle(WORDS);


  /*
    ปิดหน้าจอจบเกม
  */

  document
    .getElementById(
      "completeOverlay"
    )
    .classList.remove("show");


  render();

  updateUI();

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI() {

  document
    .getElementById("score")
    .textContent =
      score;


  document
    .getElementById("solved")
    .textContent =
      solved.size;


  /*
    จำนวนการ์ดที่ยังไม่ถูก
  */

  const unsolvedCount =
    cards.filter(
      (_, index) =>
        !solved.has(index)
    ).length;


  /*
    ต้องเลือกครบทุกคำที่เหลือ
    จึงจะกดตรวจได้
  */

  const checkBtn =
    document.getElementById(
      "checkBtn"
    );


  checkBtn.disabled =
    selected.length !==
    unsolvedCount;


  /*
    Progress
  */

  const progress =
    Math.round(
      (solved.size /
        WORDS.length) *
      100
    );


  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      progress + "%";


  document
    .getElementById(
      "progressText"
    )
    .textContent =
      progress + "%";

}


/* =====================================================
   AUTO FIT WORD
===================================================== */

function fitAllWords() {

  const elements =
    document.querySelectorAll(
      ".word"
    );


  elements.forEach(
    word => {

      let size =
        parseFloat(
          getComputedStyle(
            word
          ).fontSize
        );


      const parent =
        word.parentElement;


      const maxWidth =
        parent.clientWidth *
        .86;


      word.style.fontSize =
        size + "px";


      /*
        ลดขนาดอัตโนมัติ
        สำหรับคำยาว เช่น

        เวิร์กช็อป
        อยู่ดี กรีนดี
      */

      while (
        word.scrollWidth >
          maxWidth &&
        size > 10
      ) {

        size -= 1;

        word.style.fontSize =
          size + "px";

      }

    }
  );

}


/* =====================================================
   RESIZE
===================================================== */

function handleResize() {

  setTimeout(
    () => {

      fitAllWords();

    },
    60
  );

}


window.addEventListener(
  "resize",
  handleResize
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      fitAllWords,
      150
    );

  }
);


/* =====================================================
   START GAME
===================================================== */

newGame();

</script>

</body>
