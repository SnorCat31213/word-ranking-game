<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ล่าคำที่ถูกต้อง</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Thai", "Tahoma", sans-serif;
      background: linear-gradient(135deg, #fff8e7, #f5efe2);
      color: #4a3425;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 16px 20px 25px;
    }

    /* ===== HEADER ===== */

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 32px;
      color: #70452c;
    }

    .subtitle {
      font-size: 15px;
      color: #806a59;
    }

    /* ===== INSTRUCTION ===== */

    .instruction {
      background: #ffffff;
      border: 1px solid #e4d7c5;
      border-radius: 14px;
      padding: 10px 15px;
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.45;
      box-shadow: 0 3px 10px rgba(80, 50, 20, 0.06);
      font-size: 14px;
    }

    /* ===== STATUS ===== */

    .status {
      text-align: center;
      margin: 10px 0;
      font-size: 17px;
      font-weight: bold;
      color: #70452c;
    }

    /* ===== CARDS ===== */

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .card {
      position: relative;
      min-height: 125px;
      padding: 20px 10px 10px;

      background: #ffffff;
      border: 1px solid #e4d7c5;
      border-radius: 15px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      cursor: pointer;

      box-shadow: 0 3px 8px rgba(80, 50, 20, 0.06);

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border 0.15s ease,
        box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(80, 50, 20, 0.10);
    }

    .card.selected {
      background: #fff3d6;
      border-color: #d8b979;
    }

    .card.correct {
      background: #e5f5e7;
      border-color: #82bd89;
      cursor: default;
    }

    .card.correct:hover {
      transform: none;
    }

    /* สีแดงแค่ชั่วครู่ */
    .card.wrong-flash {
      background: #ffdede;
      border-color: #e78b8b;
      animation: shake 0.25s ease;
    }

    @keyframes shake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      50% {
        transform: translateX(4px);
      }

      75% {
        transform: translateX(-3px);
      }

      100% {
        transform: translateX(0);
      }
    }

    /* ===== RANK ===== */

    .rank {
      position: absolute;
      top: 6px;
      left: 6px;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      background: #ead8b8;
      color: #65442d;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 15px;
      font-weight: bold;
    }

    /* ===== WORD ===== */

    .word {
      font-size: 20px;
      font-weight: bold;
      color: #4d3526;
      margin-bottom: 4px;
    }

    .arrow {
      font-size: 17px;
      color: #9a816c;
      margin: 2px 0;
    }

    /* ===== ANSWER ===== */

    .answer {
      display: none;

      font-size: 17px;
      font-weight: bold;
      color: #3d7045;

      margin-top: 3px;
    }

    .card.correct .answer {
      display: block;
    }

    /* ===== REASON ===== */

    .reason {
      display: none;

      font-size: 12px;
      line-height: 1.4;

      color: #536657;

      margin-top: 8px;
      padding-top: 7px;

      border-top: 1px dashed #a9c5aa;
    }

    .card.correct .reason {
      display: block;
    }

    /* ===== RESULT ===== */

    .result {
      text-align: center;
      margin-top: 10px;

      font-size: 18px;
      font-weight: bold;

      color: #70452c;
    }

    /* ===== BUTTONS ===== */

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 10px;

      padding: 10px 22px;

      font-size: 16px;
      font-family: inherit;
      font-weight: bold;

      cursor: pointer;

      background: #8a6044;
      color: white;

      transition: 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    #answerBtn {
      display: none;
    }

    /* ===== COMPLETE ===== */

    .complete {
      display: none;

      text-align: center;

      margin-top: 10px;
      padding: 10px;

      background: #edf8ee;
      border: 1px solid #a8cbaa;
      border-radius: 12px;

      color: #3f7046;

      font-size: 19px;
      font-weight: bold;
    }

    /* =====================================================
       iPad / TABLET แนวนอน
       ===================================================== */

    @media (orientation: landscape) and (min-width: 700px) {

      .container {
        max-width: 1200px;
        padding: 12px 20px 20px;
      }

      header {
        margin-bottom: 8px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 14px;
      }

      .instruction {
        padding: 8px 14px;
        margin-bottom: 8px;
        font-size: 13px;
      }

      .status {
        margin: 8px 0;
        font-size: 16px;
      }

      .cards {
        grid-template-columns: repeat(5, 1fr);
        gap: 9px;
      }

      .card {
        min-height: 115px;
        padding: 19px 8px 8px;
      }

      .word {
        font-size: 19px;
      }

      .answer {
        font-size: 16px;
      }

      .reason {
        font-size: 11px;
        line-height: 1.35;
        margin-top: 6px;
        padding-top: 5px;
      }

      .result {
        margin-top: 8px;
        font-size: 17px;
      }

      .buttons {
        margin-top: 8px;
      }

      .complete {
        margin-top: 8px;
        padding: 8px;
        font-size: 17px;
      }
    }

    /* =====================================================
       มือถือ / จอแคบ
       ===================================================== */

    @media (max-width: 699px) {

      .container {
        padding: 18px 12px 30px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card {
        min-height: 125px;
        padding: 20px 8px 10px;
      }

      .word {
        font-size: 18px;
      }

      .reason {
        font-size: 11px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header>
      <h1>🔎 ล่าคำที่ถูกต้อง</h1>

      <div class="subtitle">
        เกมเรียงลำดับคำที่มักเขียนผิด
      </div>
    </header>


    <!-- INSTRUCTION -->

    <div class="instruction">
      <strong>วิธีเล่น:</strong>
      คลิกคำตามลำดับที่คิดว่าถูกต้อง ตั้งแต่ 1–10
      จากนั้นกด <strong>🔍 เฉลย</strong>
      เมื่อเลือกครบทุกคำ
    </div>


    <!-- STATUS -->

    <div class="status" id="status">
      เลือกคำให้ครบทั้ง 10 คำ
    </div>


    <!-- CARDS -->

    <div class="cards" id="cards"></div>


    <!-- RESULT -->

    <div class="result" id="result"></div>


    <!-- COMPLETE -->

    <div class="complete" id="complete">
      🎉 ตอบถูกครบทั้ง 10 คำแล้ว!
    </div>


    <!-- BUTTONS -->

    <div class="buttons">

      <button id="answerBtn" onclick="checkAnswer()">
        🔍 เฉลย
      </button>

      <button onclick="resetGame()">
        🔄 เล่นเกมใหม่
      </button>

    </div>

  </div>


  <script>

    /* =====================================================
       ข้อมูลคำ
       ===================================================== */

    const words = [

      {
        wrong: "สเต็ก",
        correct: "สเต๊ก",
        reason:
          "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา ทำให้ผู้คนคุ้นเคยกับคำนี้และมีโอกาสพบรูปสะกดที่หลากหลายสูง"
      },

      {
        wrong: "เฟสบุ๊ค",
        correct: "เฟซบุ๊ก",
        reason:
          "เป็นคำที่ใช้ในชีวิตประจำวันและสื่อออนไลน์อย่างแพร่หลาย จึงมีโอกาสพบการสะกดคลาดเคลื่อนจำนวนมาก"
      },

      {
        wrong: "คอมเม้นต์",
        correct: "คอมเมนต์",
        reason:
          "ใช้บ่อยในโซเชียลมีเดีย โดยเฉพาะช่องแสดงความคิดเห็น ทำให้พบรูปสะกดที่คลาดเคลื่อนได้เป็นจำนวนมาก"
      },

      {
        wrong: "ลิงค์",
        correct: "ลิงก์",
        reason:
          "ใช้เป็นประจำในเว็บไซต์ เอกสาร และการสื่อสารออนไลน์ แต่มีบริบทการใช้งานแคบกว่าคำในอันดับต้น ๆ"
      },

      {
        wrong: "บูธ",
        correct: "บูท",
        reason:
          "มักใช้ในงานแสดงสินค้า นิทรรศการ และกิจกรรมต่าง ๆ จึงพบมากในบางบริบท แต่ไม่ครอบคลุมการใช้ภาษาในชีวิตประจำวันทั้งหมด"
      },

      {
        wrong: "เวิร์กช็อป",
        correct: "เวิร์กชอป",
        reason:
          "พบในงานอบรม สัมมนา และกิจกรรมการเรียนรู้เป็นหลัก จึงมีการใช้งานเฉพาะบริบทมากกว่าคำอันดับก่อนหน้า"
      },

      {
        wrong: "แมพ",
        correct: "แมป",
        reason:
          "พบมากในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์บางกลุ่ม จึงมีการใช้จำกัดอยู่ในกลุ่มผู้ใช้เฉพาะทางมากกว่า"
      },

      {
        wrong: "ถาปัตย์",
        correct: "สถาปัตย์",
        reason:
          "เป็นคำที่เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษาเป็นหลัก จึงพบในภาษาทั่วไปน้อยกว่าคำที่อยู่ในอันดับต้น ๆ"
      },

      {
        wrong: "อยู่ดี กรีนดี",
        correct: "อยู่ดีกินดี",
        reason:
          "เป็นการเล่นคำที่เกิดขึ้นเฉพาะในบางแคมเปญหรือกิจกรรม จึงไม่ได้มีการใช้แพร่หลายในชีวิตประจำวันเหมือนคำอื่น"
      },

      {
        wrong: "นมโสด",
        correct: "นมสด",
        reason:
          "เป็นคำที่ถูกนำไปดัดแปลงเป็นคำเล่นในบางร้านหรือแคมเปญการตลาด จึงพบเฉพาะกรณีและไม่ใช่การสะกดผิดที่เกิดขึ้นทั่วไป"
      }

    ];


    /* =====================================================
       ตัวแปรเกม
       ===================================================== */

    let solved = new Set();

    let currentSelection = [];

    let gameWords = [];


    /* =====================================================
       เริ่มเกม
       ===================================================== */

    function createCards() {

      const cardsContainer =
        document.getElementById("cards");

      cardsContainer.innerHTML = "";

      currentSelection = [];

      solved = new Set();

      gameWords = [...words];

      shuffle(gameWords);


      gameWords.forEach((item, index) => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.dataset.index =
          words.indexOf(item);


        card.innerHTML = `

          <div class="rank"></div>

          <div class="word">
            ${item.wrong}
          </div>

          <div class="arrow">
            ↓
          </div>

          <div class="answer">
            ${item.correct}
          </div>

          <div class="reason">
            ${item.reason}
          </div>

        `;


        card.onclick = function () {

          selectCard(
            card,
            words.indexOf(item)
          );

        };


        cardsContainer.appendChild(card);

      });


      document.getElementById("result").textContent = "";

      document.getElementById("complete").style.display =
        "none";

      document.getElementById("answerBtn").style.display =
        "none";

      updateStatus();

    }


    /* =====================================================
       คลิกเลือกคำ
       ===================================================== */

    function selectCard(card, index) {

      /* คำที่ตอบถูกแล้ว ห้ามเลือกซ้ำ */

      if (solved.has(index)) {
        return;
      }


      /* ถ้าคำนี้ถูกเลือกในรอบนี้แล้ว */

      if (currentSelection.includes(index)) {
        return;
      }


      currentSelection.push(index);

      card.classList.add("selected");


      const rank =
        card.querySelector(".rank");

      rank.textContent =
        currentSelection.length;


      updateStatus();


      /* เลือกครบทุกคำที่ยังไม่ถูก */

      const remaining =
        words.length - solved.size;


      if (currentSelection.length === remaining) {

        document.getElementById("answerBtn").style.display =
          "inline-block";

      }

    }


    /* =====================================================
       ตรวจคำตอบ
       ===================================================== */

    function checkAnswer() {

      if (currentSelection.length === 0) {
        return;
      }


      let correctThisRound = 0;


      currentSelection.forEach((index, position) => {

        const card =
          document.querySelector(
            `.card[data-index="${index}"]`
          );


        const correctPosition =
          index + 1;


        const selectedPosition =
          position + 1;


        if (
          selectedPosition === correctPosition
        ) {

          /* ==========================
             ถูก
             ========================== */

          card.classList.remove("selected");

          card.classList.add("correct");

          solved.add(index);

          correctThisRound++;

        }

        else {

          /* ==========================
             ผิด
             ========================== */

          card.classList.remove("selected");

          card.classList.add("wrong-flash");


          setTimeout(() => {

            card.classList.remove("wrong-flash");

            const rank =
              card.querySelector(".rank");

            rank.textContent = "";

          }, 700);

        }

      });


      /* เคลียร์รอบปัจจุบัน */

      currentSelection = [];


      /* ปิดปุ่มเฉลยก่อน */

      document.getElementById("answerBtn").style.display =
        "none";


      /* อัปเดตคะแนน */

      document.getElementById("result").textContent =
        `รอบนี้ตอบถูก ${correctThisRound} คำ`;


      updateStatus();


      /* ถ้าถูกครบทั้งหมด */

      if (solved.size === words.length) {

        document.getElementById("complete").style.display =
          "block";

        document.getElementById("result").textContent =
          "🏆 เยี่ยมมาก! ตอบถูกครบทั้ง 10 คำแล้ว";

        return;
      }


      /* เตรียมคำที่ยังผิดให้ตอบใหม่ */

      prepareWrongAnswers();

    }


    /* =====================================================
       เตรียมคำที่ยังตอบผิด
       ===================================================== */

    function prepareWrongAnswers() {

      const cards =
        document.querySelectorAll(".card");


      cards.forEach(card => {

        const index =
          Number(card.dataset.index);


        /* คำที่ถูกแล้ว ล็อกไว้ */

        if (solved.has(index)) {

          card.classList.add("correct");

          return;

        }


        /* คำที่ยังไม่ถูก */

        card.classList.remove("selected");

        card.classList.remove("wrong-flash");

        const rank =
          card.querySelector(".rank");

        rank.textContent = "";

      });


      updateStatus();

    }


    /* =====================================================
       อัปเดตสถานะ
       ===================================================== */

    function updateStatus() {

      const remaining =
        words.length - solved.size;


      const status =
        document.getElementById("status");


      if (remaining === 0) {

        status.textContent =
          "🎉 ตอบถูกครบทุกคำแล้ว!";

      }

      else {

        status.textContent =
          `เหลือคำที่ยังตอบไม่ถูก ${remaining} คำ`;

      }

    }


    /* =====================================================
       สุ่มคำ
       ===================================================== */

    function shuffle(array) {

      for (
        let i = array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          array[i],
          array[j]
        ] =
        [
          array[j],
          array[i]
        ];

      }

    }


    /* =====================================================
       เล่นเกมใหม่
       ===================================================== */

    function resetGame() {

      createCards();

    }


    /* =====================================================
       เริ่มเกมครั้งแรก
       ===================================================== */

    createCards();

  </script>

</body>
</html>
