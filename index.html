<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>เกมจัดอันดับคำภาษาไทย</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", "Noto Sans Thai", sans-serif;
}

body {
    background:
        radial-gradient(circle at top left, #fff8df, transparent 35%),
        radial-gradient(circle at bottom right, #ffe5d1, transparent 35%),
        linear-gradient(135deg, #f7efe3, #fffaf3);

    color: #3d3027;
    overflow: hidden;
}

/* =========================
   MAIN
========================= */

.game {
    width: 100%;
    height: 100vh;
    padding: 18px 28px 16px;

    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.title-area h1 {
    margin: 0;

    font-size: clamp(25px, 3vw, 40px);
    font-weight: 900;

    color: #5a3926;
    letter-spacing: -1px;
}

.title-area p {
    margin: 3px 0 0;

    font-size: clamp(12px, 1.2vw, 16px);
    color: #907565;
}

.score-box {
    min-width: 150px;

    padding: 10px 18px;

    border-radius: 18px;

    background: rgba(255,255,255,.75);
    border: 1px solid #eadac9;

    text-align: center;

    box-shadow: 0 8px 25px rgba(90,57,38,.08);
}

.score-label {
    font-size: 11px;
    color: #9b806d;
}

.score {
    font-size: 25px;
    font-weight: 900;
    color: #b66b38;
}

/* =========================
   INSTRUCTION
========================= */

.instruction {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 42px;

    padding: 7px 15px;
    margin-bottom: 8px;

    border-radius: 14px;

    background: rgba(255,255,255,.82);
    border: 1px solid #eadaca;

    color: #705a4a;

    font-size: clamp(12px, 1.2vw, 15px);
    text-align: center;

    box-shadow: 0 5px 18px rgba(80,50,30,.05);
}

/* =========================
   STATUS
========================= */

.status {
    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 30px;
    margin-bottom: 7px;

    font-size: clamp(13px, 1.3vw, 17px);
    font-weight: 700;

    color: #785c49;
}

.status strong {
    color: #b96835;
    margin: 0 4px;
}

/* =========================
   BOARD
========================= */

.board {
    flex: 1;

    display: grid;

    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));

    gap: 10px;

    min-height: 0;
}

/* =========================
   CARD
========================= */

.card {
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    min-width: 0;
    min-height: 0;

    padding: 8px;

    border-radius: 17px;

    background: rgba(255,255,255,.94);
    border: 2px solid #eadbca;

    cursor: pointer;

    box-shadow:
        0 7px 18px rgba(90,57,38,.07);

    transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease,
        background .16s ease;
}

.card:hover {
    transform: translateY(-2px);

    border-color: #d5b49a;

    box-shadow:
        0 10px 22px rgba(90,57,38,.12);
}

.card:active {
    transform: scale(.97);
}

/* Selected */

.card.selected {
    background: #fff4e5;
    border-color: #d79b68;

    box-shadow:
        0 0 0 3px rgba(215,155,104,.12),
        0 10px 25px rgba(160,100,55,.12);
}

/* Correct */

.card.correct {
    background: #edf9ef;
    border-color: #67b579;

    cursor: default;

    box-shadow:
        0 8px 20px rgba(72,145,86,.13);
}

.card.correct:hover {
    transform: none;
}

/* Wrong */

.card.wrong {
    animation: wrongFlash .7s ease;
}

@keyframes wrongFlash {
    0% {
        background: #fff;
        border-color: #eadbca;
    }

    25% {
        background: #ffe2e2;
        border-color: #e46d6d;
        transform: scale(.97);
    }

    60% {
        background: #ffe2e2;
        border-color: #e46d6d;
    }

    100% {
        background: #fff;
        border-color: #eadbca;
        transform: scale(1);
    }
}

/* =========================
   NUMBER
========================= */

.number {
    position: absolute;
    top: 8px;
    left: 9px;

    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #f2e5d7;
    color: #896b55;

    font-size: 13px;
    font-weight: 900;
}

.card.selected .number {
    background: #c87943;
    color: white;
}

.card.correct .number {
    background: #54a567;
    color: white;
}

/* =========================
   WORD
========================= */

.word {
    margin-top: 5px;

    font-size: clamp(16px, 1.8vw, 24px);
    font-weight: 900;

    text-align: center;

    color: #493429;

    word-break: keep-all;
}

/* =========================
   ANSWER
========================= */

.answer {
    margin-top: 4px;

    font-size: clamp(11px, 1.1vw, 14px);
    font-weight: 800;

    color: #3e9151;
    text-align: center;
}

.reason {
    margin-top: 2px;

    max-width: 90%;

    font-size: clamp(9px, .85vw, 11px);
    line-height: 1.25;

    color: #6d806f;
    text-align: center;
}

/* =========================
   BOTTOM
========================= */

.bottom {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    min-height: 48px;

    margin-top: 9px;
}

button {
    border: 0;

    padding: 11px 25px;

    border-radius: 13px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 900;

    cursor: pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

button:active {
    transform: scale(.96);
}

.check-btn {
    background: #bd7040;
    color: white;

    box-shadow:
        0 7px 17px rgba(189,112,64,.25);
}

.check-btn:hover {
    box-shadow:
        0 10px 22px rgba(189,112,64,.32);
}

.reset-btn {
    background: white;
    color: #765b48;

    border: 1px solid #dfcfbf;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

/* =========================
   COMPLETE
========================= */

.complete {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(63,43,30,.38);
    backdrop-filter: blur(7px);

    z-index: 100;
}

.complete.show {
    display: flex;
}

.complete-box {
    width: min(430px, 90vw);

    padding: 35px 28px;

    border-radius: 25px;

    background: #fffaf4;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(50,30,15,.25);
}

.trophy {
    font-size: 55px;
}

.complete-box h2 {
    margin: 8px 0 5px;

    font-size: 29px;

    color: #573b29;
}

.final-score {
    margin: 8px 0 20px;

    font-size: 20px;
    font-weight: 900;

    color: #b96c38;
}

/* =========================
   TABLET / PORTRAIT
========================= */

@media (max-width: 900px) {

    body {
        overflow: auto;
    }

    .game {
        height: auto;
        min-height: 100vh;

        padding: 18px;
    }

    .board {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: none;

        flex: none;
    }

    .card {
        min-height: 135px;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header {
        align-items: flex-start;
    }

    .title-area h1 {
        font-size: 25px;
    }

    .score-box {
        min-width: 90px;
        padding: 7px 10px;
    }

    .score {
        font-size: 20px;
    }

    .instruction {
        line-height: 1.4;
    }

    .board {
        grid-template-columns: 1fr;
    }

    .card {
        min-height: 125px;
    }

    .bottom {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="game">

    <!-- HEADER -->
    <header class="header">

        <div class="title-area">
            <h1>🎯 เกมจัดอันดับคำภาษาไทย</h1>
            <p>เรียงคำที่กำหนดให้ตามอันดับที่ถูกต้อง</p>
        </div>

        <div class="score-box">
            <div class="score-label">คะแนน</div>
            <div class="score">
                <span id="score">0</span> / 10
            </div>
        </div>

    </header>


    <!-- INSTRUCTION -->
    <div class="instruction">
        👆 คลิกคำตามลำดับที่คิดว่าถูกต้อง ตั้งแต่ <b>อันดับ 1 → 10</b>
        แล้วกด “เฉลย”
    </div>


    <!-- STATUS -->
    <div class="status" id="status">
        เลือกคำ <strong>1</strong> จากทั้งหมด 10 คำ
    </div>


    <!-- GAME BOARD -->
    <main class="board" id="board"></main>


    <!-- BUTTONS -->
    <div class="bottom">

        <button
            class="check-btn"
            id="checkBtn"
            onclick="checkAnswers()"
            disabled>
            🔍 เฉลย
        </button>

        <button
            class="reset-btn"
            onclick="newGame()">
            🔄 เกมใหม่
        </button>

    </div>

</div>


<!-- COMPLETE -->
<div class="complete" id="complete">

    <div class="complete-box">

        <div class="trophy">🏆</div>

        <h2>ยอดเยี่ยม!</h2>

        <div class="final-score" id="finalScore">
            ได้ 10 / 10 คะแนน
        </div>

        <button
            class="check-btn"
            onclick="newGame()">
            🎮 เล่นเกมใหม่
        </button>

    </div>

</div>


<script>

/* =========================================
   DATA
========================================= */

const WORDS = [

    {
        wrong: "สเต็ก",
        correct: "สเต๊ก",
        reason:
            "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา"
    },

    {
        wrong: "เฟสบุ๊ค",
        correct: "เฟซบุ๊ก",
        reason:
            "เป็นคำที่ใช้แพร่หลายในชีวิตประจำวันและสื่อออนไลน์"
    },

    {
        wrong: "คอมเม้นต์",
        correct: "คอมเมนต์",
        reason:
            "ใช้บ่อยในโซเชียลมีเดียและช่องแสดงความคิดเห็น"
    },

    {
        wrong: "ลิงค์",
        correct: "ลิงก์",
        reason:
            "พบเป็นประจำในเว็บไซต์ เอกสาร และการสื่อสารออนไลน์"
    },

    {
        wrong: "บูธ",
        correct: "บูท",
        reason:
            "มักพบในงานแสดงสินค้า นิทรรศการ และกิจกรรมต่าง ๆ"
    },

    {
        wrong: "เวิร์กช็อป",
        correct: "เวิร์กชอป",
        reason:
            "พบมากในงานอบรม สัมมนา และกิจกรรมการเรียนรู้"
    },

    {
        wrong: "แมพ",
        correct: "แมป",
        reason:
            "พบในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์"
    },

    {
        wrong: "ถาปัตย์",
        correct: "สถาปัตย์",
        reason:
            "เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษาเป็นหลัก"
    },

    {
        wrong: "อยู่ดี กรีนดี",
        correct: "อยู่ดีกินดี",
        reason:
            "เป็นการเล่นคำที่พบเฉพาะในบางแคมเปญหรือกิจกรรม"
    },

    {
        wrong: "นมโสด",
        correct: "นมสด",
        reason:
            "เป็นคำเล่นที่ใช้ในบางร้านหรือแคมเปญการตลาด"
    }

];


/* =========================================
   GAME VARIABLES
========================================= */

let shuffledWords = [];

let selected = [];

let solved = new Set();

let score = 0;


/* =========================================
   START GAME
========================================= */

function newGame() {

    shuffledWords = [...WORDS]
        .sort(() => Math.random() - 0.5);

    selected = [];
    solved = new Set();
    score = 0;

    document
        .getElementById("complete")
        .classList.remove("show");

    render();
    updateStatus();
    updateScore();
}


/* =========================================
   RENDER CARDS
========================================= */

function render() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    shuffledWords.forEach((item, index) => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.dataset.index = index;

        card.innerHTML = `

            <div class="number">
                ${solved.has(index)
                    ? "✓"
                    : getSelectedNumber(index)}
            </div>

            <div class="word">
                ${item.wrong}
            </div>

            ${
                solved.has(index)
                ?
                `
                <div class="answer">
                    ✓ คำที่ถูก: ${item.correct}
                </div>

                <div class="reason">
                    ${item.reason}
                </div>
                `
                :
                ""
            }
        `;


        if (solved.has(index)) {

            card.classList.add("correct");

        }


        if (
            selected.some(
                item => item.index === index
            )
        ) {

            card.classList.add("selected");

        }


        if (!solved.has(index)) {

            card.onclick = () =>
                selectCard(index);

        }


        board.appendChild(card);

    });


    const checkBtn =
        document.getElementById("checkBtn");

    checkBtn.disabled =
        selected.length !==
        getRemainingCount();

}


/* =========================================
   GET SELECTED NUMBER
========================================= */

function getSelectedNumber(index) {

    const found =
        selected.find(
            item => item.index === index
        );

    if (!found) return "";

    return found.number;
}


/* =========================================
   SELECT CARD
========================================= */

function selectCard(index) {

    if (solved.has(index)) return;

    if (
        selected.some(
            item => item.index === index
        )
    ) {
        return;
    }


    selected.push({

        index: index,

        number:
            selected.length + 1

    });


    render();

    updateStatus();

}


/* =========================================
   GET REMAINING
========================================= */

function getRemainingCount() {

    return shuffledWords.length -
           solved.size;

}


/* =========================================
   CHECK ANSWERS
========================================= */

function checkAnswers() {

    if (
        selected.length !==
        getRemainingCount()
    ) {
        return;
    }


    let newCorrect = 0;


    selected.forEach(selection => {

        const index =
            selection.index;

        /*
            index + 1
            คืออันดับที่ถูกต้อง
        */

        const correctRank =
            index + 1;


        if (
            selection.number ===
            correctRank
        ) {

            solved.add(index);

            score++;

            newCorrect++;

        }

    });


    /*
        แสดงผลถูก / ผิด
    */

    selected.forEach(selection => {

        const card =
            document.querySelector(
                `.card[data-index="${selection.index}"]`
            );

        if (!card) return;


        if (
            solved.has(selection.index)
        ) {

            card.classList.remove("selected");

            card.classList.add("correct");

            card.innerHTML = `

                <div class="number">✓</div>

                <div class="word">
                    ${shuffledWords[
                        selection.index
                    ].wrong}
                </div>

                <div class="answer">
                    ✓ คำที่ถูก:
                    ${shuffledWords[
                        selection.index
                    ].correct}
                </div>

                <div class="reason">
                    ${shuffledWords[
                        selection.index
                    ].reason}
                </div>

            `;

        }

        else {

            card.classList.add("wrong");

        }

    });


    /*
        เคลียร์คำตอบที่ผิด
    */

    setTimeout(() => {

        selected = [];

        render();

        updateStatus();
        updateScore();


        /*
            จบเกม
        */

        if (
            solved.size ===
            shuffledWords.length
        ) {

            setTimeout(showComplete, 350);

        }

    }, 750);

}


/* =========================================
   STATUS
========================================= */

function updateStatus() {

    const status =
        document.getElementById("status");


    if (
        solved.size ===
        shuffledWords.length
    ) {

        status.innerHTML =
            "🎉 <strong>ตอบถูกครบทั้ง 10 คำแล้ว!</strong>";

        return;

    }


    const remaining =
        getRemainingCount();


    if (selected.length === 0) {

        status.innerHTML =
            `เลือกคำ <strong>1</strong> จากทั้งหมด
             <strong>${remaining}</strong> คำ`;

        return;

    }


    status.innerHTML =
        `เลือกแล้ว <strong>${selected.length}</strong>
         จาก <strong>${remaining}</strong> คำ`;

}


/* =========================================
   SCORE
========================================= */

function updateScore() {

    document
        .getElementById("score")
        .textContent = score;

}


/* =========================================
   COMPLETE
========================================= */

function showComplete() {

    document
        .getElementById("finalScore")
        .textContent =
        `ได้ ${score} / 10 คะแนน`;

    document
        .getElementById("complete")
        .classList.add("show");

}


/* =========================================
   START
========================================= */

newGame();

</script>

</body>
</html>
