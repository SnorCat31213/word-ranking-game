<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>เกมจัดอันดับคำภาษาไทย</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  font-family:
    "Noto Sans Thai",
    "Noto Sans",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 0%,
      #fff9ec 0%,
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      #ffe7c5 0%,
      transparent 35%
    ),
    #f5ede1;

  color: #49382c;
}


/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  min-height: 100dvh;

  padding:
    clamp(8px, 1.2dvh, 20px)
    clamp(10px, 1.5vw, 30px);

  display: flex;
  flex-direction: column;

  overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  padding:
    clamp(8px, 1.2dvh, 18px)
    clamp(12px, 1.5vw, 26px);

  border-radius:
    clamp(14px, 1.2vw, 24px);

  background: rgba(255,255,255,.82);

  border: 1px solid rgba(110,80,50,.12);

  box-shadow:
    0 8px 25px rgba(80,55,35,.08);
}

.title-area {
  min-width: 0;
}

.title {
  margin: 0;

  font-size:
    clamp(20px, 2.3vw, 44px);

  line-height: 1.05;

  font-weight: 900;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.subtitle {
  margin-top: 4px;

  font-size:
    clamp(10px, .9vw, 17px);

  color: #8c7763;
}

.score {
  flex-shrink: 0;

  padding:
    clamp(7px, .8dvh, 13px)
    clamp(10px, 1.2vw, 22px);

  border-radius: 999px;

  background: #fff2d4;

  border: 1px solid #edcf96;

  font-size:
    clamp(12px, 1vw, 20px);

  font-weight: 900;

  white-space: nowrap;
}


/* =========================================================
   INFO
========================================================= */

.info {
  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  padding:
    clamp(6px, .8dvh, 12px)
    4px;
}

.instruction {
  font-size:
    clamp(10px, .95vw, 18px);

  font-weight: 700;

  color: #765e4b;

  white-space: nowrap;
}

.status {
  font-size:
    clamp(10px, .9vw, 17px);

  font-weight: 800;

  color: #a16b32;

  text-align: right;

  white-space: nowrap;
}


/* =========================================================
   BOARD
========================================================= */

.board {
  flex: 1;

  min-height: 0;
  min-width: 0;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  grid-template-rows:
    repeat(2, minmax(0, 1fr));

  gap:
    clamp(7px, .9vw, 16px);

  overflow: hidden;
}


/* =========================================================
   CARD
========================================================= */

.card {
  position: relative;

  min-width: 0;
  min-height: 0;

  padding:
    clamp(7px, .8vw, 15px);

  border:
    clamp(1px, .12vw, 2px)
    solid
    #dfcdb7;

  border-radius:
    clamp(12px, 1.1vw, 22px);

  background:
    rgba(255,255,255,.94);

  box-shadow:
    0 6px 18px rgba(82,58,38,.08);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  overflow: hidden;

  cursor: pointer;

  user-select: none;

  transition:
    transform .15s ease,
    border-color .15s ease,
    background .15s ease,
    box-shadow .15s ease;
}

.card:hover:not(.locked) {
  transform: translateY(-3px);

  border-color: #d69a4c;

  box-shadow:
    0 10px 24px rgba(82,58,38,.14);
}

.card.selected {
  background: #fff4dd;

  border-color: #d78a29;

  box-shadow:
    0 0 0 3px rgba(215,138,41,.13),
    0 10px 22px rgba(82,58,38,.12);
}

.card.locked {
  background: #edf9ef;

  border-color: #64a972;

  cursor: default;
}


/* =========================================================
   NUMBER
========================================================= */

.number {
  position: absolute;

  top:
    clamp(5px, .6vw, 10px);

  left:
    clamp(5px, .6vw, 10px);

  width:
    clamp(22px, 2vw, 36px);

  height:
    clamp(22px, 2vw, 36px);

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #f0e6d8;

  color: #92765c;

  font-size:
    clamp(9px, .75vw, 15px);

  font-weight: 900;
}

.card.selected .number {
  background: #d88928;

  color: white;

  font-size:
    clamp(10px, .85vw, 17px);
}

.card.locked .number {
  background: #58a568;

  color: white;

  /*
    แสดงเลขอันดับที่ถูกต้อง
    ไม่ใช่เครื่องหมาย ✓
  */

  font-size:
    clamp(11px, 1vw, 19px);

  font-weight: 900;
}


/* =========================================================
   WORD
========================================================= */

.word {
  width: 100%;

  max-width: 100%;

  text-align: center;

  font-size:
    clamp(16px, 2vw, 40px);

  line-height: 1.05;

  font-weight: 900;

  white-space: nowrap;

  overflow: hidden;

  transform-origin: center;
}

.card.locked .word {
  color: #2c713c;
}


/* =========================================================
   ANSWER
========================================================= */

.answer-box {
  width: 100%;

  margin-top:
    clamp(4px, .5dvh, 8px);

  min-width: 0;

  overflow: hidden;
}

.correct-label {
  font-size:
    clamp(7px, .6vw, 12px);

  font-weight: 700;

  color: #67916f;
}

.correct-rank {
  font-size:
    clamp(9px, .8vw, 15px);

  font-weight: 900;

  color: #397d48;

  margin-top: 1px;
}

.correct-word {
  font-size:
    clamp(11px, 1vw, 19px);

  font-weight: 900;

  color: #28703a;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.reason {
  margin-top: 2px;

  font-size:
    clamp(7px, .55vw, 11px);

  line-height: 1.15;

  color: #67816c;

  display: -webkit-box;

  -webkit-box-orient: vertical;

  -webkit-line-clamp: 2;

  overflow: hidden;
}


/* =========================================================
   WRONG FLASH
========================================================= */

.card.wrong {
  animation:
    wrongFlash .7s ease;
}

@keyframes wrongFlash {

  0% {
    background: #ffe8e5;

    border-color: #df5c50;

    transform: scale(.98);
  }

  35% {
    background: #ffd0cb;

    border-color: #d94336;

    transform: scale(1.02);
  }

  100% {
    background: #fff;

    border-color: #dfcdb7;

    transform: scale(1);
  }

}


/* =========================================================
   BUTTONS
========================================================= */

.controls {
  flex-shrink: 0;

  display: flex;

  justify-content: center;

  align-items: center;

  gap:
    clamp(6px, .9vw, 16px);

  padding-top:
    clamp(7px, .9dvh, 14px);
}

button {
  border: none;

  font-family: inherit;

  font-size:
    clamp(10px, .9vw, 17px);

  font-weight: 900;

  padding:
    clamp(7px, .8dvh, 13px)
    clamp(10px, 1.4vw, 24px);

  border-radius: 999px;

  cursor: pointer;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:disabled {
  opacity: .4;

  cursor: not-allowed;
}

.clear-btn {
  background: #ebe1d5;

  color: #655244;
}

.answer-btn {
  background: #d88b2d;

  color: white;

  box-shadow:
    0 5px 14px rgba(180,108,27,.22);
}

.new-btn {
  background: #5b9d68;

  color: white;

  box-shadow:
    0 5px 14px rgba(58,116,69,.20);
}


/* =========================================================
   COMPLETE
========================================================= */

.complete {
  position: fixed;

  inset: 0;

  z-index: 999;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(50,37,27,.45);
}

.complete.show {
  display: flex;
}

.complete-box {
  width:
    min(90vw, 520px);

  padding:
    clamp(22px, 4vw, 45px);

  border-radius: 28px;

  background: #fffaf1;

  text-align: center;

  box-shadow:
    0 25px 70px rgba(40,27,17,.25);
}

.complete-icon {
  font-size:
    clamp(40px, 7vw, 75px);
}

.complete-title {
  margin-top: 5px;

  font-size:
    clamp(25px, 3vw, 44px);

  font-weight: 900;
}

.complete-score {
  margin:
    8px 0 20px;

  font-size:
    clamp(15px, 1.5vw, 24px);

  color: #8c6a4c;
}


/* =========================================================
   LARGE TV / DESKTOP
========================================================= */

@media (min-width: 1600px) {

  .app {
    padding:
      18px 28px;
  }

  .board {
    gap: 14px;
  }

}


/* =========================================================
   SMALL LANDSCAPE
========================================================= */

@media (
  orientation: landscape
) and (
  max-height: 700px
) {

  .app {
    padding:
      5px 10px;
  }

  .header {
    padding:
      5px 12px;
  }

  .subtitle {
    display: none;
  }

  .info {
    padding:
      3px 2px;
  }

  .controls {
    padding-top: 4px;
  }

  .card {
    padding: 4px;
  }

}


/* =========================================================
   iPAD LANDSCAPE
========================================================= */

@media (
  orientation: landscape
) and (
  min-width: 700px
) and (
  max-width: 1200px
) {

  .board {
    gap: 8px;
  }

  .title {
    font-size:
      clamp(20px, 2.7vw, 32px);
  }

}


/* =========================================================
   PORTRAIT
========================================================= */

@media (orientation: portrait) {

  html,
  body {
    overflow-x: hidden;

    overflow-y: auto;
  }

  .app {
    min-height: 100dvh;

    height: auto;

    overflow: visible;
  }

  .header {
    align-items: flex-start;
  }

  .title {
    white-space: normal;
  }

  .subtitle {
    line-height: 1.2;
  }

  .info {
    align-items: flex-start;

    flex-direction: column;
  }

  .status {
    text-align: left;
  }

  .board {
    flex: none;

    height: auto;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    grid-template-rows: none;

    overflow: visible;

    gap: 8px;
  }

  .card {
    min-height:
      clamp(130px, 22vw, 190px);
  }

  .controls {
    flex-wrap: wrap;

    padding-bottom: 12px;
  }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (
  orientation: portrait
) and (
  max-width: 430px
) {

  .app {
    padding: 7px;
  }

  .header {
    padding: 10px;
  }

  .title {
    font-size: 20px;
  }

  .score {
    font-size: 11px;

    padding:
      6px 8px;
  }

  .instruction {
    white-space: normal;
  }

  .board {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .card {
    min-height: 135px;
  }

  .controls button {
    flex:
      1 1 30%;
  }

}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media (
  orientation: portrait
) and (
  max-width: 330px
) {

  .board {
    grid-template-columns: 1fr;
  }

  .card {
    min-height: 125px;
  }

}

</style>
</head>


<body>


<div class="app">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="title-area">

      <h1 class="title">
        🎯 เกมจัดอันดับคำภาษาไทย
      </h1>

      <div class="subtitle">
        คลิกคำเพื่อจัดอันดับให้ถูกต้อง
      </div>

    </div>


    <div
      class="score"
      id="score"
    >
      🏆 คะแนน 0 / 10
    </div>

  </header>


  <!-- =====================================================
       INSTRUCTION
  ====================================================== -->

  <section class="info">

    <div class="instruction">
      👆 คลิกคำเพื่อเลือกอันดับ • คลิกซ้ำเพื่อยกเลิก
    </div>

    <div
      class="status"
      id="status"
    >
      เลือกคำให้ครบทั้ง 10 คำ
    </div>

  </section>


  <!-- =====================================================
       BOARD
  ====================================================== -->

  <main
    class="board"
    id="board"
  ></main>


  <!-- =====================================================
       BUTTONS
  ====================================================== -->

  <div class="controls">

    <button
      class="clear-btn"
      id="clearBtn"
      onclick="clearSelected()"
    >
      ↩️ ล้างคำตอบที่เลือก
    </button>


    <button
      class="answer-btn"
      id="answerBtn"
      onclick="checkAnswers()"
      disabled
    >
      🔍 เฉลย
    </button>


    <button
      class="new-btn"
      onclick="newGame()"
    >
      🔄 เริ่มเกมใหม่
    </button>

  </div>

</div>


<!-- =======================================================
     COMPLETE MODAL
======================================================= -->

<div
  class="complete"
  id="complete"
>

  <div class="complete-box">

    <div class="complete-icon">
      🎉
    </div>

    <div class="complete-title">
      เก่งมาก!
    </div>

    <div
      class="complete-score"
      id="completeScore"
    >
      คะแนน 10 / 10
    </div>

    <button
      class="new-btn"
      onclick="newGame()"
    >
      🔄 เล่นเกมใหม่
    </button>

  </div>

</div>


<script>


/* =========================================================
   WORD DATA
========================================================= */

const WORDS = [

  {
    rank: 1,
    wrong: "สเต็ก",
    correct: "สเต๊ก",
    reason:
      "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา"
  },

  {
    rank: 2,
    wrong: "เฟสบุ๊ค",
    correct: "เฟซบุ๊ก",
    reason:
      "ใช้แพร่หลายในชีวิตประจำวันและสื่อออนไลน์"
  },

  {
    rank: 3,
    wrong: "คอมเม้นต์",
    correct: "คอมเมนต์",
    reason:
      "ใช้บ่อยในโซเชียลมีเดียและช่องแสดงความคิดเห็น"
  },

  {
    rank: 4,
    wrong: "ลิงค์",
    correct: "ลิงก์",
    reason:
      "พบเป็นประจำในเว็บไซต์ เอกสาร และการสื่อสารออนไลน์"
  },

  {
    rank: 5,
    wrong: "บูธ",
    correct: "บูท",
    reason:
      "มักพบในงานแสดงสินค้า นิทรรศการ และกิจกรรมต่าง ๆ"
  },

  {
    rank: 6,
    wrong: "เวิร์กช็อป",
    correct: "เวิร์กชอป",
    reason:
      "พบมากในงานอบรม สัมมนา และกิจกรรมการเรียนรู้"
  },

  {
    rank: 7,
    wrong: "แมพ",
    correct: "แมป",
    reason:
      "พบในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์"
  },

  {
    rank: 8,
    wrong: "ถาปัตย์",
    correct: "สถาปัตย์",
    reason:
      "เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษา"
  },

  {
    rank: 9,
    wrong: "อยู่ดี กรีนดี",
    correct: "อยู่ดีกินดี",
    reason:
      "เป็นการเล่นคำที่พบเฉพาะในบางแคมเปญหรือกิจกรรม"
  },

  {
    rank: 10,
    wrong: "นมโสด",
    correct: "นมสด",
    reason:
      "เป็นคำเล่นที่ใช้ในบางร้านหรือแคมเปญการตลาด"
  }

];


/* =========================================================
   GAME STATE
========================================================= */

let shuffledWords = [];

let selected = [];

let solved = new Set();

let wrongCards = new Set();

let score = 0;


/* =========================================================
   DOM
========================================================= */

const board =
  document.getElementById("board");

const scoreEl =
  document.getElementById("score");

const statusEl =
  document.getElementById("status");

const answerBtn =
  document.getElementById("answerBtn");

const clearBtn =
  document.getElementById("clearBtn");

const complete =
  document.getElementById("complete");

const completeScore =
  document.getElementById("completeScore");


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;
}


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

  shuffledWords =
    shuffle(WORDS);

  selected = [];

  solved.clear();

  wrongCards.clear();

  score = 0;

  complete.classList.remove("show");

  render();

  updateUI();

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  board.innerHTML = "";


  shuffledWords.forEach(
    (item, index) => {

      const card =
        document.createElement("div");

      card.className = "card";


      const selection =
        selected.find(
          s => s.index === index
        );


      const isSolved =
        solved.has(index);


      /* CARD STATE */

      if (selection) {

        card.classList.add(
          "selected"
        );

      }


      if (isSolved) {

        card.classList.add(
          "locked"
        );

      }


      if (wrongCards.has(index)) {

        card.classList.add(
          "wrong"
        );

      }


      /* NUMBER */

      const number =
        document.createElement("div");

      number.className =
        "number";


      /*
        ยังไม่ตอบ
        = ○

        กำลังเลือก
        = เลขลำดับที่เลือก

        ตอบถูก
        = เลขอันดับจริง 1–10
      */

      if (isSolved) {

        number.textContent =
          item.rank;

      }

      else if (selection) {

        number.textContent =
          selection.number;

      }

      else {

        number.textContent =
          "○";

      }


      /* WORD */

      const word =
        document.createElement("div");

      word.className =
        "word";

      word.textContent =
        item.wrong;


      card.appendChild(number);

      card.appendChild(word);


      /* =================================================
         SHOW CORRECT ANSWER
      ================================================= */

      if (isSolved) {

        const answerBox =
          document.createElement("div");

        answerBox.className =
          "answer-box";


        answerBox.innerHTML = `

          <div class="correct-label">
            ✓ ตอบถูก
          </div>

          <div class="correct-rank">
            อันดับที่ ${item.rank}
          </div>

          <div class="correct-word">
            ${item.correct}
          </div>

          <div class="reason">
            ${item.reason}
          </div>

        `;


        card.appendChild(
          answerBox
        );

      }


      /* CLICK */

      card.addEventListener(
        "click",
        () => selectCard(index)
      );


      board.appendChild(card);

    }
  );


  /*
    ปรับขนาดคำให้พอดี
  */

  requestAnimationFrame(
    fitAllWords
  );

}


/* =========================================================
   SELECT / UNSELECT
========================================================= */

function selectCard(index) {

  /*
    ถ้าตอบถูกแล้ว
    ไม่สามารถเลือกอีก
  */

  if (solved.has(index)) {

    return;

  }


  /*
    ตรวจว่าการ์ดถูกเลือกอยู่หรือไม่
  */

  const existingIndex =
    selected.findIndex(
      s => s.index === index
    );


  /*
    ถ้าเลือกอยู่
    = ยกเลิก
  */

  if (existingIndex !== -1) {

    selected.splice(
      existingIndex,
      1
    );

  }


  /*
    ถ้ายังไม่ได้เลือก
    = เพิ่มเข้าไป
  */

  else {

    selected.push({
      index: index,
      number: selected.length + 1
    });

  }


  /*
    เรียงเลขใหม่
  */

  selected.forEach(
    (item, i) => {

      item.number =
        i + 1;

    }
  );


  render();

  updateUI();

}


/* =========================================================
   CLEAR
========================================================= */

function clearSelected() {

  /*
    ล้างเฉพาะคำที่กำลังเลือก
    ไม่ล้างคำที่ตอบถูกแล้ว
  */

  selected = [];

  render();

  updateUI();

}


/* =========================================================
   CHECK ANSWERS
========================================================= */

function checkAnswers() {

  const remaining =
    WORDS.length -
    solved.size;


  /*
    ต้องเลือกครบก่อน
  */

  if (
    selected.length !== remaining
  ) {

    return;

  }


  selected.forEach(
    selection => {

      const index =
        selection.index;

      const item =
        shuffledWords[index];


      /*
        ใช้ rank จริงของคำ
        ไม่ใช้ตำแหน่งการ์ด
      */

      if (
        selection.number ===
        item.rank
      ) {

        /*
          ถูก
          ล็อกการ์ด
        */

        solved.add(index);

        score++;

      }

      else {

        /*
          ผิด
          แสดงสีแดงชั่วคราว
        */

        wrongCards.add(index);

      }

    }
  );


  /*
    ล้างเลขที่ผู้เล่นเลือก
  */

  selected = [];


  render();

  updateUI();


  /*
    เอาสีแดงออก
  */

  setTimeout(
    () => {

      wrongCards.clear();

      render();

    },
    700
  );


  /*
    ตรวจว่าจบเกมหรือยัง
  */

  if (
    solved.size ===
    WORDS.length
  ) {

    setTimeout(
      () => {

        completeScore.textContent =
          `คะแนน ${score} / ${WORDS.length}`;

        complete.classList.add(
          "show"
        );

      },
      800
    );

  }

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

  scoreEl.textContent =
    `🏆 คะแนน ${score} / ${WORDS.length}`;


  const remaining =
    WORDS.length -
    solved.size;


  if (remaining === 0) {

    statusEl.textContent =
      "🎉 ถูกครบทุกคำแล้ว!";

  }

  else {

    statusEl.textContent =
      `เลือกแล้ว ${selected.length} / ${remaining} คำ`;

  }


  /*
    ปุ่มเฉลยเปิดเมื่อ
    เลือกคำที่เหลือครบ
  */

  answerBtn.disabled =
    selected.length !== remaining ||
    remaining === 0;


  /*
    ปุ่มล้าง
  */

  clearBtn.disabled =
    selected.length === 0;

}


/* =========================================================
   AUTO FIT WORDS
========================================================= */

function fitAllWords() {

  const cards =
    document.querySelectorAll(
      ".card"
    );


  cards.forEach(card => {

    const word =
      card.querySelector(
        ".word"
      );


    if (!word) {

      return;

    }


    /*
      ขนาดเริ่มต้น
    */

    let size =
      Math.min(
        card.clientWidth * .18,
        card.clientHeight * .28,
        44
      );


    size =
      Math.max(
        size,
        12
      );


    word.style.fontSize =
      `${size}px`;


    /*
      ลดขนาดจนกว่าจะพอดี
    */

    while (
      word.scrollWidth >
        word.clientWidth + 1
      &&
      size > 12
    ) {

      size -= .5;

      word.style.fontSize =
        `${size}px`;

    }

  });

}


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer;


function handleResize() {

  clearTimeout(
    resizeTimer
  );


  resizeTimer =
    setTimeout(
      () => {

        fitAllWords();

      },
      50
    );

}


window.addEventListener(
  "resize",
  handleResize
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      fitAllWords,
      150
    );

  }
);


/* =========================================================
   START
========================================================= */

newGame();

</script>
