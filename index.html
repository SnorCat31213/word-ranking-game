<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ล่าคำที่ถูกต้อง</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: linear-gradient(135deg, #fff8e7, #f5efe2);
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 950px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 10px;
      color: #5b4636;
    }

    .subtitle {
      color: #777;
      font-size: 17px;
    }

    .instruction {
      background: white;
      border: 2px solid #eadfce;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      line-height: 1.7;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .instruction strong {
      color: #a66331;
    }

    .status {
      text-align: center;
      margin: 20px 0;
      font-size: 19px;
      font-weight: bold;
      color: #5b4636;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .card {
      position: relative;
      background: white;
      border: 3px solid #e4d7c5;
      border-radius: 18px;
      padding: 25px 18px;
      min-height: 145px;
      text-align: center;
      cursor: pointer;
      transition:
        background 0.25s,
        border-color 0.25s,
        transform 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #c99b68;
    }

    /* กำลังเลือก */
    .card.selected {
      border-color: #8b6b4a;
      background: #f8f0e4;
    }

    /* ถูก */
    .card.correct {
      border-color: #55a36a;
      background: #edf8ef;
      cursor: default;
    }

    .card.correct:hover {
      transform: none;
    }

    /* ผิด - แสดงเพียงชั่วคราว */
    .card.incorrect {
      border-color: #d16b6b;
      background: #fff0f0;
      animation: incorrectFlash 0.7s ease;
    }

    @keyframes incorrectFlash {

      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }

    }

    .rank {
      position: absolute;
      top: 10px;
      left: 10px;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: #8b6b4a;
      color: white;

      display: none;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: bold;
    }

    .card.selected .rank,
    .card.correct .rank {
      display: flex;
    }

    .card.correct .rank {
      background: #55a36a;
    }

    .word {
      font-size: 24px;
      font-weight: bold;
      color: #4d3b2e;
      margin-bottom: 8px;
    }

    .arrow {
      color: #999;
      font-size: 20px;
    }

    /* คำตอบที่ถูก */
    .answer {
      display: none;
      margin-top: 5px;
      font-size: 20px;
      font-weight: bold;
      color: #27743b;
    }

    .card.correct .answer {
      display: block;
    }

    /* เหตุผล */
    .reason {
      display: none;
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.12);
      font-size: 15px;
      line-height: 1.6;
      text-align: left;
      color: #45604b;
    }

    .card.correct .reason {
      display: block;
    }

    .result {
      text-align: center;
      margin-top: 25px;
      font-size: 23px;
      font-weight: bold;
      color: #5b4636;
    }

    .buttons {
      text-align: center;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      margin: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #answerBtn {
      background: #5b4636;
      color: white;
      display: none;
    }

    #answerBtn:hover {
      background: #453429;
    }

    #newGameBtn {
      background: #d8c2a8;
      color: #4d3b2e;
    }

    #newGameBtn:hover {
      background: #cdb393;
    }

    .complete {
      text-align: center;
      margin-top: 25px;
      padding: 20px;
      border-radius: 18px;
      background: #edf8ef;
      border: 2px solid #55a36a;
      color: #27743b;
      font-size: 23px;
      font-weight: bold;
      display: none;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 30px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 125px;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <header>

    <h1>🔎 ล่าคำที่ถูกต้อง</h1>

    <div class="subtitle">
      เกมเรียงลำดับคำที่มักเขียนผิด
    </div>

  </header>


  <div class="instruction">

    <strong>วิธีเล่น</strong><br>

    คลิกคำตามลำดับที่คิดว่า
    <strong>พบการเขียนผิดบ่อยที่สุด</strong>

    <br>

    เลือกให้ครบก่อน แล้วกด
    <strong>เฉลย</strong>

    <br>

    ถ้าตอบผิด สามารถลองจัดอันดับใหม่ได้

  </div>


  <div class="status" id="status">
    กำลังเริ่มเกม...
  </div>


  <div class="cards" id="cards"></div>


  <div class="result" id="result"></div>


  <div class="complete" id="complete">

    🎉 ยอดเยี่ยม!<br>
    ตอบถูกครบทั้ง 10 คำแล้ว

  </div>


  <div class="buttons">

    <button id="answerBtn" onclick="checkAnswer()">
      🔍 เฉลย
    </button>

    <button id="newGameBtn" onclick="newGame()">
      🔄 เล่นเกมใหม่
    </button>

  </div>

</div>


<script>

/* =====================================================
   ข้อมูลคำ
===================================================== */

const words = [

  {
    wrong: "สเต็ก",
    correct: "สเต๊ก",
    reason: "พบเห็นบ่อยในเมนูอาหาร ป้ายร้าน และโฆษณา ทำให้ผู้คนคุ้นเคยกับคำนี้และมีโอกาสพบรูปสะกดที่หลากหลายสูง"
  },

  {
    wrong: "เฟสบุ๊ค",
    correct: "เฟซบุ๊ก",
    reason: "เป็นคำที่ใช้ในชีวิตประจำวันและสื่อออนไลน์อย่างแพร่หลาย จึงมีโอกาสพบการสะกดคลาดเคลื่อนจำนวนมาก"
  },

  {
    wrong: "คอมเม้นต์",
    correct: "คอมเมนต์",
    reason: "ใช้บ่อยในโซเชียลมีเดีย โดยเฉพาะช่องแสดงความคิดเห็น ทำให้พบรูปสะกดที่คลาดเคลื่อนได้เป็นจำนวนมาก"
  },

  {
    wrong: "ลิงค์",
    correct: "ลิงก์",
    reason: "ใช้เป็นประจำในเว็บไซต์ เอกสาร และการสื่อสารออนไลน์ แต่มีบริบทการใช้งานแคบกว่าคำในอันดับต้น ๆ"
  },

  {
    wrong: "บูธ",
    correct: "บูท",
    reason: "มักใช้ในงานแสดงสินค้า นิทรรศการ และกิจกรรมต่าง ๆ จึงพบมากในบางบริบท แต่ไม่ครอบคลุมการใช้ภาษาในชีวิตประจำวันทั้งหมด"
  },

  {
    wrong: "เวิร์กช็อป",
    correct: "เวิร์กชอป",
    reason: "พบในงานอบรม สัมมนา และกิจกรรมการเรียนรู้เป็นหลัก จึงมีการใช้งานเฉพาะบริบทมากกว่าคำอันดับก่อนหน้า"
  },

  {
    wrong: "แมพ",
    correct: "แมป",
    reason: "พบมากในบริบทเกม เทคโนโลยี และการใช้งานออนไลน์บางกลุ่ม จึงมีการใช้จำกัดอยู่ในกลุ่มผู้ใช้เฉพาะทางมากกว่า"
  },

  {
    wrong: "ถาปัตย์",
    correct: "สถาปัตย์",
    reason: "เป็นคำที่เกี่ยวข้องกับวงการสถาปัตยกรรมและกลุ่มนักศึกษาเป็นหลัก จึงพบในภาษาทั่วไปน้อยกว่าคำที่อยู่ในอันดับต้น ๆ"
  },

  {
    wrong: "อยู่ดี กรีนดี",
    correct: "อยู่ดีกินดี",
    reason: "เป็นการเล่นคำที่เกิดขึ้นเฉพาะในบางแคมเปญหรือกิจกรรม จึงไม่ได้มีการใช้แพร่หลายในชีวิตประจำวันเหมือนคำอื่น"
  },

  {
    wrong: "นมโสด",
    correct: "นมสด",
    reason: "เป็นคำที่ถูกนำไปดัดแปลงเป็นคำเล่นในบางร้านหรือแคมเปญการตลาด จึงพบเฉพาะกรณีและไม่ใช่การสะกดผิดที่เกิดขึ้นทั่วไป"
  }

];


/* =====================================================
   ตัวแปรเกม
===================================================== */

let solved = new Set();

let currentSelection = [];


/* =====================================================
   สุ่ม
===================================================== */

function shuffle(array) {

  return [...array].sort(() => Math.random() - 0.5);

}


/* =====================================================
   เกมใหม่
===================================================== */

function newGame() {

  solved = new Set();

  currentSelection = [];

  document.getElementById("result").textContent = "";

  document.getElementById("complete").style.display = "none";

  document.getElementById("answerBtn").style.display = "none";

  createCards();

  updateStatus();

}


/* =====================================================
   สร้างการ์ด
===================================================== */

function createCards() {

  const container = document.getElementById("cards");

  container.innerHTML = "";

  const shuffled = shuffle(words);


  shuffled.forEach(word => {

    const index = words.indexOf(word);

    const card = document.createElement("div");

    card.className = "card";

    card.dataset.index = index;


    card.innerHTML = `

      <div class="rank"></div>

      <div class="word">
        ${word.wrong}
      </div>

      <div class="arrow">
        ↓
      </div>

      <div class="answer">
        ${word.correct}
      </div>

      <div class="reason">
        ${word.reason}
      </div>

    `;


    card.addEventListener("click", () => {

      selectCard(card, index);

    });


    container.appendChild(card);

  });

}


/* =====================================================
   เลือกคำ
===================================================== */

function selectCard(card, index) {

  // คำที่ถูกแล้วล็อก ห้ามเลือก
  if (solved.has(index)) return;


  // ถ้าเลือกคำนี้ไปแล้วในรอบนี้
  if (currentSelection.includes(index)) return;


  // เอาสีแดงออกเมื่อเริ่มตอบใหม่
  card.classList.remove("incorrect");


  // เพิ่มคำเข้าไปในรอบปัจจุบัน
  currentSelection.push(index);

  const number = currentSelection.length;


  // กำลังเลือก
  card.classList.add("selected");


  // ใส่อันดับ
  card.querySelector(".rank").textContent =
    number;


  updateStatus();


  // จำนวนคำที่ยังเหลือ
  const remaining =
    words.length - solved.size;


  // เลือกครบแล้ว
  if (currentSelection.length === remaining) {

    document.getElementById("answerBtn").style.display =
      "inline-block";

    document.getElementById("status").textContent =
      "เลือกครบแล้ว — กด “เฉลย” ได้เลย 🔍";

  }

}


/* =====================================================
   เฉลย
===================================================== */

function checkAnswer() {

  const remaining =
    words.length - solved.size;


  // ต้องเลือกครบก่อน
  if (currentSelection.length !== remaining) {
    return;
  }


  let correctThisRound = 0;


  currentSelection.forEach((index, position) => {

    const card = document.querySelector(
      `.card[data-index="${index}"]`
    );


    // อันดับที่ผู้เล่นเลือก
    const selectedRank =
      position + 1;


    // อันดับที่ถูกต้อง
    const correctRank =
      index + 1;


    // =========================
    // ตอบถูก
    // =========================

    if (selectedRank === correctRank) {

      solved.add(index);


      card.classList.remove("selected");

      card.classList.remove("incorrect");


      // ถูกแล้วเขียวค้าง
      card.classList.add("correct");

      card.classList.add("locked");


      card.querySelector(".rank").textContent =
        selectedRank;


      correctThisRound++;

    }


    // =========================
    // ตอบผิด
    // =========================

    else {

      card.classList.remove("selected");

      card.classList.add("incorrect");

      // สำคัญ: ไม่ล็อก
      card.classList.remove("locked");


      card.querySelector(".rank").textContent =
        selectedRank;


      /*
        สีแดงอยู่เพียง 700ms
        แล้วกลับเป็นการ์ดปกติ
      */

      setTimeout(() => {

        // ถ้ายังไม่ถูก ให้กลับเป็นปกติ
        if (!solved.has(index)) {

          card.classList.remove("incorrect");

          card.querySelector(".rank").textContent = "";

        }

      }, 700);

    }

  });


  // ล้างคำตอบรอบนี้
  currentSelection = [];


  // ซ่อนปุ่มเฉลย
  document.getElementById("answerBtn").style.display =
    "none";


  // =========================
  // ถูกครบ 10
  // =========================

  if (solved.size === words.length) {

    document.getElementById("status").textContent =
      "🎉 ตอบถูกครบทั้ง 10 คำแล้ว!";


    document.getElementById("result").textContent =
      "🏆 10 / 10";


    document.getElementById("complete").style.display =
      "block";


    return;
  }


  // =========================
  // ยังมีคำที่ผิด
  // =========================

  document.getElementById("result").textContent =
    `รอบนี้ถูก ${correctThisRound} คำ`;


  prepareWrongAnswers();

}


/* =====================================================
   เตรียมรอบต่อไป
===================================================== */

function prepareWrongAnswers() {

  const cards =
    document.querySelectorAll(".card");


  cards.forEach(card => {

    const index =
      Number(card.dataset.index);


    // =========================
    // คำที่ถูกแล้ว
    // =========================

    if (solved.has(index)) {

      card.classList.add("correct");

      card.classList.add("locked");

      return;

    }


    // =========================
    // คำที่ยังผิด
    // =========================

    card.classList.remove("selected");

    card.classList.remove("locked");


    /*
      ไม่ล็อกการ์ดผิด
      เพื่อให้ตอบใหม่ได้
    */


    /*
      ไม่ลบ incorrect ตรงนี้
      ให้ setTimeout เป็นคนลบ
      เพื่อให้เห็นสีแดงชั่วคราว
    */


    card.querySelector(".rank").textContent = "";

  });


  const remaining =
    words.length - solved.size;


  document.getElementById("status").textContent =
    `🔴 คำที่ผิดตอบใหม่ได้ — เหลือ ${remaining} คำ`;

}


/* =====================================================
   อัปเดตสถานะ
===================================================== */

function updateStatus() {

  const remaining =
    words.length - solved.size;


  const selected =
    currentSelection.length;


  if (remaining === 0) {

    document.getElementById("status").textContent =
      "🎉 ตอบถูกครบแล้ว";

    return;

  }


  if (selected === 0) {

    document.getElementById("status").textContent =
      `เลือกคำที่เหลือ ${remaining} คำ`;

  }

  else {

    document.getElementById("status").textContent =
      `เลือกแล้ว ${selected} / ${remaining} คำ`;

  }

}


/* =====================================================
   เริ่มเกม
===================================================== */

newGame();

</script>

</body>
</html>
